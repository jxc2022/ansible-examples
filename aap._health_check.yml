# ---------------------------------------------------------
# PLAY 1 — Dynamic Inventory (single server list)
# ---------------------------------------------------------
- name: Build dynamic inventory
  hosts: localhost
  gather_facts: no

  vars:
    server_list: |
      192.168.1.60

  tasks:

    - name: Convert server_list string to a list
      set_fact:
        servers: "{{ server_list.split('\n')
                     | map('trim')
                     | select('ne','')
                     | unique
                     | list }}"

    - name: Create dynamic group linux_servers
      add_host:
        name: "{{ item }}"
        groups: linux_servers
      loop: "{{ servers }}"

    - name: Show dynamically added servers
      debug:
        msg: "Added {{ servers }} to group linux_servers"


# ---------------------------------------------------------
# PLAY 2 — Collect health data
# ---------------------------------------------------------
- name: Collect health data from RHEL servers
  hosts: linux_servers
  become: yes
  gather_facts: yes

  tasks:

    - name: Check disk space
      command: df -h
      register: disk_output

    - name: Check free memory
      command: free -h
      register: mem_output

    - name: Check uptime
      command: uptime -p
      register: uptime_output

    - name: Check running Podman containers as aap user
      become_user: aap
      command: podman ps --format "table {{ '{{.Names}}' }}\t{{ '{{.Status}}' }}\t{{ '{{.Image}}' }}"
      register: podman_output
      ignore_errors: yes

    # -----------------------------------------------------
    # PERFORMANCE / SLOWNESS CHECKS
    # -----------------------------------------------------
    - name: Get system load average
      command: cat /proc/loadavg
      register: loadavg_output
      changed_when: false
      ignore_errors: yes

    - name: Get per-container CPU/memory usage snapshot
      become_user: aap
      command: podman stats --no-stream --format "table {{ '{{.Name}}' }}\t{{ '{{.CPUPerc}}' }}\t{{ '{{.MemPerc}}' }}\t{{ '{{.MemUsage}}' }}"
      register: podman_stats_output
      ignore_errors: yes
      changed_when: false

    # -----------------------------------------------------
    # SSSD LOG COLLECTION (last 1 hour)
    # -----------------------------------------------------
    - name: Collect recent SSSD errors
      command: journalctl -u sssd --since "1 hour ago"
      register: sssd_logs
      ignore_errors: yes

    # -----------------------------------------------------
    # Targeted PostgreSQL volume disk check (host-agnostic —
    # works whether postgresql runs on this host or not, and
    # regardless of whether it's colocated with other AAP
    # containers or split onto its own host in prod)
    # -----------------------------------------------------
    - name: Check for postgres/postgresql container on this host
      become_user: aap
      command: podman ps --filter "name=postgres" --format "{{ '{{.Names}}' }}"
      register: pg_container_check
      ignore_errors: yes
      changed_when: false

    - name: Set discovered postgres container name
      set_fact:
        pg_container_name: "{{ (pg_container_check.stdout_lines | default([]) | select('match', '^postgres') | list | first) | default('') }}"

    - name: Get postgres container's actual volume mount source
      become_user: aap
      command: podman inspect {{ pg_container_name }} --format "{{ '{{ range .Mounts }}{{ .Source }}{{ \"\\n\" }}{{ end }}' }}"
      register: pg_mount_raw
      when: pg_container_name != ''
      ignore_errors: yes
      changed_when: false

    - name: Get disk usage for postgresql volume path
      command: "df -h {{ (pg_mount_raw.stdout_lines | default([]) | select('ne','') | list | first) }}"
      register: pg_disk_usage
      when: pg_mount_raw is defined and (pg_mount_raw.stdout_lines | default([]) | select('ne','') | list | length > 0)
      ignore_errors: yes
      changed_when: false

    - name: Set postgres disk fact (only populated on the host actually running postgresql)
      set_fact:
        postgres_disk_info: "{{ pg_disk_usage.stdout_lines | default([]) }}"

    # -----------------------------------------------------
    # Consolidate host facts
    # -----------------------------------------------------
    - name: Set host facts for report
      set_fact:
        health_report:
          disk: "{{ disk_output.stdout_lines }}"
          memory: "{{ mem_output.stdout_lines }}"
          uptime: "{{ uptime_output.stdout }}"
          podman: "{{ (podman_output.stdout_lines | default([]))[1:] if (podman_output.stdout_lines | default([]) | length > 0) else [] }}"
          sssd_logs: "{{ sssd_logs.stdout_lines | default([]) }}"
          postgres_disk: "{{ postgres_disk_info | default([]) }}"
          load_avg: "{{ loadavg_output.stdout | default('N/A') }}"
          cpu_count: "{{ ansible_processor_vcpus | default('N/A') }}"
          podman_stats: "{{ podman_stats_output.stdout_lines | default([]) }}"


# ---------------------------------------------------------
# PLAY 3 — Build HTML report and send email (inline template)
# ---------------------------------------------------------
- name: Build and email consolidated HTML report
  hosts: localhost
  gather_facts: yes

  vars:
    report_file:      "/tmp/prod_aap.html"
    html_file_path:   "/tmp/prod_aap.html"
    recipient:        "{{ recipient | mandatory }}"
    gmail_user:       "jorge.x.chavez@gmail.com"
    gmail_password:   "nnmk dzsm ylgf tsur"
    report_local_dir: "/tmp/reports"
    aap_api_root:     "https://192.168.1.60"
    aap_api_base:     "https://192.168.1.60/api/controller/v2"
    aap_token:        "6fXfwf7Au4ZdyT3wzqHyOe1XkpcjRa"

  tasks:

    # -----------------------------------------------------
    # Query AAP platform version / patch level
    # -----------------------------------------------------
    - name: Query AAP Gateway ping endpoint for platform version
      uri:
        url: "{{ aap_api_root }}/api/gateway/v1/ping/"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: no
        return_content: yes
      register: aap_gateway_ping
      ignore_errors: yes

    - name: Query AAP Gateway status endpoint
      uri:
        url: "{{ aap_api_root }}/api/gateway/v1/status/"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: no
        return_content: yes
      register: aap_gateway_status
      ignore_errors: yes

    - name: Query AAP Gateway services endpoint
      uri:
        url: "{{ aap_api_root }}/api/gateway/v1/services/"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: no
        return_content: yes
      register: aap_gateway_services
      ignore_errors: yes

    - name: Query Automation Hub status endpoint
      uri:
        url: "{{ aap_api_root }}/api/galaxy/pulp/api/v3/status/"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: no
        return_content: yes
      register: aap_hub_status
      ignore_errors: yes

    - name: Query AAP ping endpoint for version info
      uri:
        url: "{{ aap_api_base }}/ping/"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: no
        return_content: yes
      register: aap_ping
      ignore_errors: yes

    - name: Query AAP config endpoint for license/patch info
      uri:
        url: "{{ aap_api_base }}/config/"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: no
        return_content: yes
      register: aap_config
      ignore_errors: yes

    - name: Set component health facts
      set_fact:
        controller_health: "{{ 'OK' if (aap_ping.status | default(0)) == 200 else 'FAIL' }}"
        gateway_ping_health: "{{ 'OK' if (aap_gateway_ping.status | default(0)) == 200 else 'FAIL' }}"
        gateway_status_health: "{{ 'OK' if (aap_gateway_status.status | default(0)) == 200 else 'FAIL' }}"
        gateway_services_health: "{{ 'OK' if (aap_gateway_services.status | default(0)) == 200 else 'FAIL' }}"
        hub_health: "{{ 'OK' if (aap_hub_status.status | default(0)) == 200 else 'FAIL' }}"

    - name: Query current AAP job queue depth (pending/waiting/running)
      uri:
        url: "{{ aap_api_base }}/jobs/?status__in=pending,waiting,running&page_size=1"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: no
        return_content: yes
      register: aap_job_queue
      ignore_errors: yes

    - name: Set performance facts
      set_fact:
        aap_job_queue_depth: "{{ aap_job_queue.json.count | default('N/A') }}"
        aap_api_latency_ms: "{{ ((aap_gateway_ping.elapsed | default(0)) * 1000) | round(0, 'common') }}"

    - name: Set AAP version facts
      set_fact:
        aap_version: "{{ aap_gateway_ping.json.version | default('Unavailable') }}"
        aap_controller_build: "{{ aap_config.json.version | default(aap_ping.json.version) | default('Unavailable') }}"
        aap_node_versions: "{{ aap_ping.json.instances | default([]) | map(attribute='version') | default([]) | list }}"

    - name: Set AAP license/subscription facts
      set_fact:
        aap_license_type: "{{ aap_config.json.license_info.license_type | default('Unavailable') }}"
        aap_subscription_name: "{{ aap_config.json.license_info.subscription_name | default('Unavailable') }}"
        aap_license_compliant: "{{ aap_config.json.license_info.compliant | default(false) }}"
        aap_license_expiration: "{{ '%Y-%m-%d' | strftime(aap_config.json.license_info.license_date) if aap_config.json.license_info.license_date is defined else 'Unavailable' }}"
        aap_current_instances: "{{ aap_config.json.license_info.automated_instances | default('N/A') }}"
        aap_instance_count: "{{ aap_config.json.license_info.instance_count | default('N/A') }}"
        aap_account_number: "{{ aap_config.json.license_info.account_number | default('N/A') }}"
        aap_subscription_id: "{{ aap_config.json.license_info.subscription_id | default('N/A') }}"

    # -----------------------------------------------------
    # Gather all host health data — hostname -> full hostvars
    # (template below expects data.health_report.*, so we
    # keep the whole hostvars entry per host, not just the
    # nested health_report dict)
    # -----------------------------------------------------
    - name: Gather all host health data
      set_fact:
        all_reports: >-
          {{
            hostvars
            | dict2items
            | selectattr('value.health_report', 'defined')
            | items2dict(key_name='key', value_name='value')
          }}

    - name: Compute summary counts
      set_fact:
        total_hosts: "{{ all_reports | length }}"

    # -----------------------------------------------------
    # Inline HTML report — no external .j2 file needed
    # (ported from consolidated_report.j2)
    # -----------------------------------------------------
    - name: Render consolidated HTML report inline
      set_fact:
        html_report: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>AAP Consolidated Health Report</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 20px; background: #121212; color: #e0e0e0; }
                  h1 { color: #7db3e8; }
                  h2 { color: #6fb98f; border-bottom: 1px solid #333; padding-bottom: 6px; }
                  h3 { color: #a0c4e0; }
                  pre { background: #1e1e1e; color: #d0d0d0; padding: 10px; border-radius: 5px; border: 1px solid #333; overflow-x: auto; }
                  a { color: #7db3e8; }
                  table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
                  th, td { border: 1px solid #333; padding: 8px; text-align: left; }
                  th { background-color: #1f2a38; color: #cfe3f7; }
                  tr:nth-child(even) { background-color: #1a1a1a; }
                  tr:nth-child(odd) { background-color: #161616; }
                  .host-section { margin-bottom: 40px; }
                  hr { border: none; border-top: 1px solid #333; }
              </style>
          </head>
          <body>
          <h1>AAP Consolidated Health Report</h1>
          <p>Generated on {{ ansible_date_time.date }} at {{ ansible_date_time.time }}</p>
          <p><strong>AAP Version:</strong> {{ aap_version }} (Controller build {{ aap_controller_build }})</p>
          <p><strong>Subscription:</strong> {{ aap_subscription_name }} ({{ aap_license_type | capitalize }})
             | <strong>License Status:</strong> <span style="{{ 'color:#ffffff;background-color:#2e7d32;font-weight:bold;padding:2px 8px;border-radius:4px;' if aap_license_compliant else 'color:#ffffff;background-color:#c62828;font-weight:bold;padding:2px 8px;border-radius:4px;' }}">{{ 'Compliant' if aap_license_compliant else 'Non-Compliant' }}</span>
             | <strong>Expires:</strong> {{ aap_license_expiration }}
             | <strong>Automated Instances:</strong> {{ aap_current_instances }} / {{ aap_instance_count }}
          </p>
          <p><strong>Account Number:</strong> {{ aap_account_number }}
             | <strong>Subscription ID:</strong> {{ aap_subscription_id }}
          </p>
          <hr>
          <!-- ========================= -->
          <!--      STATUS LEGEND        -->
          <!-- ========================= -->
          <h2>Status Legend</h2>
          <p>
            <span style="color:#ffffff;background-color:#2e7d32;font-weight:bold;padding:2px 8px;border-radius:4px;">OK</span>
            &nbsp;= Healthy / within normal threshold&nbsp;&nbsp;&nbsp;
            <span style="color:#ffffff;background-color:#c62828;font-weight:bold;padding:2px 8px;border-radius:4px;">Warning</span>
            &nbsp;= Needs attention
          </p>
          <table>
              <tr>
                  <th>Check</th>
                  <th>Green (OK) means</th>
                  <th>Red (Warning) means</th>
              </tr>
              <tr>
                  <td>Component Health (Controller, Hub, Gateway)</td>
                  <td>Endpoint returned HTTP 200 — service is reachable</td>
                  <td>Endpoint failed to respond or returned an error</td>
              </tr>
              <tr>
                  <td>License Status</td>
                  <td>Subscription is compliant</td>
                  <td>Subscription is non-compliant — may affect support/functionality</td>
              </tr>
              <tr>
                  <td>Disk Usage (per host)</td>
                  <td>Highest filesystem usage on host is below 75%</td>
                  <td>A filesystem on the host is at or above 75% used</td>
              </tr>
              <tr>
                  <td>SSSD Health (per host)</td>
                  <td>No SSSD errors logged in the last hour</td>
                  <td>SSSD errors were logged in the last hour — possible AD/auth issue</td>
              </tr>
              <tr>
                  <td>AAP API Response Time</td>
                  <td>Gateway responded in under 1 second</td>
                  <td>Gateway took 1 second or longer to respond — possible platform slowness</td>
              </tr>
              <tr>
                  <td>Active/Pending/Waiting Jobs</td>
                  <td>10 or fewer jobs currently queued or running</td>
                  <td>More than 10 jobs queued — possible automation backlog</td>
              </tr>
              <tr>
                  <td>Per-Host Load Average</td>
                  <td>1-minute load average is below the host's CPU core count</td>
                  <td>Load average meets or exceeds CPU core count — host is under heavy load</td>
              </tr>
          </table>
          <hr>
          <!-- ========================= -->
          <!--     COMPONENT HEALTH      -->
          <!-- ========================= -->
          <h2>Component Health</h2>
          <table>
              <tr>
                  <th>Component</th>
                  <th>Endpoint</th>
                  <th>Status</th>
              </tr>
              <tr>
                  <td>Automation Controller</td>
                  <td>/api/controller/v2/ping/</td>
                  <td><span style="{{ 'color:#ffffff;background-color:#2e7d32;font-weight:bold;padding:2px 8px;border-radius:4px;' if controller_health == 'OK' else 'color:#ffffff;background-color:#c62828;font-weight:bold;padding:2px 8px;border-radius:4px;' }}">{{ controller_health }}</span></td>
              </tr>
              <tr>
                  <td>Automation Hub</td>
                  <td>/api/galaxy/pulp/api/v3/status/</td>
                  <td><span style="{{ 'color:#ffffff;background-color:#2e7d32;font-weight:bold;padding:2px 8px;border-radius:4px;' if hub_health == 'OK' else 'color:#ffffff;background-color:#c62828;font-weight:bold;padding:2px 8px;border-radius:4px;' }}">{{ hub_health }}</span></td>
              </tr>
              <tr>
                  <td>Automation Gateway (ping)</td>
                  <td>/api/gateway/v1/ping/</td>
                  <td><span style="{{ 'color:#ffffff;background-color:#2e7d32;font-weight:bold;padding:2px 8px;border-radius:4px;' if gateway_ping_health == 'OK' else 'color:#ffffff;background-color:#c62828;font-weight:bold;padding:2px 8px;border-radius:4px;' }}">{{ gateway_ping_health }}</span></td>
              </tr>
              <tr>
                  <td>Automation Gateway (status)</td>
                  <td>/api/gateway/v1/status/</td>
                  <td><span style="{{ 'color:#ffffff;background-color:#2e7d32;font-weight:bold;padding:2px 8px;border-radius:4px;' if gateway_status_health == 'OK' else 'color:#ffffff;background-color:#c62828;font-weight:bold;padding:2px 8px;border-radius:4px;' }}">{{ gateway_status_health }}</span></td>
              </tr>
              <tr>
                  <td>Automation Gateway (services)</td>
                  <td>/api/gateway/v1/services/</td>
                  <td><span style="{{ 'color:#ffffff;background-color:#2e7d32;font-weight:bold;padding:2px 8px;border-radius:4px;' if gateway_services_health == 'OK' else 'color:#ffffff;background-color:#c62828;font-weight:bold;padding:2px 8px;border-radius:4px;' }}">{{ gateway_services_health }}</span></td>
              </tr>
              <tr>
                  <td>Event Driven Ansible</td>
                  <td>No official health endpoint (see AAPRFE-1202)</td>
                  <td>N/A</td>
              </tr>
          </table>
          <hr>
          <!-- ========================= -->
          <!--      SUMMARY TABLE        -->
          <!-- ========================= -->
          <h2>Summary</h2>
          <table>
              <tr>
                  <th>Host</th>
                  <th>Max Disk Usage</th>
                  <th>Status</th>
                  <th>Podman Containers</th>
                  <th>Uptime</th>
                  <th>SSSD Health</th>
              </tr>
              {% for host, data in all_reports.items() %}
              {% set max_disk = (data.health_report.disk | map('regex_search', '\\d+%') | select('string') | list) %}
              {% set max_disk_val = (max_disk | map('replace', '%', '') | map('int') | max) %}
              {% set status = 'OK' if max_disk_val < 75 else 'Warning' %}
              {% set sssd_status = 'OK' if (data.health_report.sssd_logs | length == 0 or (data.health_report.sssd_logs | length == 1 and 'No entries' in data.health_report.sssd_logs[0])) else 'Warning' %}
              <tr>
                  <td>{{ host }}</td>
                  <td>{{ max_disk_val }}%</td>
                  <td><span style="{{ 'color:#ffffff;background-color:#2e7d32;font-weight:bold;padding:2px 8px;border-radius:4px;' if status == 'OK' else 'color:#ffffff;background-color:#c62828;font-weight:bold;padding:2px 8px;border-radius:4px;' }}">{{ status }}</span></td>
                  <td>{{ data.health_report.podman | length }}</td>
                  <td>{{ data.health_report.uptime }}</td>
                  <td><span style="{{ 'color:#ffffff;background-color:#2e7d32;font-weight:bold;padding:2px 8px;border-radius:4px;' if sssd_status == 'OK' else 'color:#ffffff;background-color:#c62828;font-weight:bold;padding:2px 8px;border-radius:4px;' }}">{{ sssd_status }}</span></td>
              </tr>
              {% endfor %}
          </table>
          <hr>
          <!-- ========================= -->
          <!--   POSTGRESQL DB VOLUME    -->
          <!-- ========================= -->
          <h2>PostgreSQL Data Volume</h2>
          {% set pg_hosts = all_reports.items() | selectattr('1.health_report.postgres_disk', 'defined') | selectattr('1.health_report.postgres_disk', '!=', []) | list %}
          {% if pg_hosts %}
          {% for host, data in pg_hosts %}
          <p><strong>Host:</strong> {{ host }}</p>
          <pre>
          {% for line in data.health_report.postgres_disk %}
          {{ line }}
          {% endfor %}
          </pre>
          {% endfor %}
          {% else %}
          <p>PostgreSQL container not found on any monitored host — volume usage unavailable.</p>
          {% endif %}
          <hr>
          <!-- ========================= -->
          <!--  PERFORMANCE / SLOWNESS   -->
          <!-- ========================= -->
          <h2>Performance &amp; Slowness Checks</h2>
          <table>
              <tr>
                  <th>Check</th>
                  <th>Value</th>
                  <th>Status</th>
              </tr>
              <tr>
                  <td>AAP API Response Time</td>
                  <td>{{ aap_api_latency_ms }} ms</td>
                  <td><span style="{{ 'color:#ffffff;background-color:#2e7d32;font-weight:bold;padding:2px 8px;border-radius:4px;' if (aap_api_latency_ms | int) < 1000 else 'color:#ffffff;background-color:#c62828;font-weight:bold;padding:2px 8px;border-radius:4px;' }}">{{ 'OK' if (aap_api_latency_ms | int) < 1000 else 'Warning' }}</span></td>
              </tr>
              <tr>
                  <td>Active/Pending/Waiting Jobs</td>
                  <td>{{ aap_job_queue_depth }}</td>
                  <td><span style="{{ 'color:#ffffff;background-color:#2e7d32;font-weight:bold;padding:2px 8px;border-radius:4px;' if ((aap_job_queue_depth | int(-1)) <= 10 and (aap_job_queue_depth | int(-1)) >= 0) else 'color:#ffffff;background-color:#c62828;font-weight:bold;padding:2px 8px;border-radius:4px;' }}">{{ 'OK' if (aap_job_queue_depth | int(-1)) <= 10 and (aap_job_queue_depth | int(-1)) >= 0 else 'Warning' }}</span></td>
              </tr>
          </table>
          <h3>Per-Host Load Average &amp; Container Resource Usage</h3>
          {% for host, data in all_reports.items() %}
          {% set load1 = (data.health_report.load_avg.split(' ')[0] | default('0')) if data.health_report.load_avg != 'N/A' else '0' %}
          {% set cpu_ct = data.health_report.cpu_count | default(1) %}
          {% set load_status = 'OK' if (load1 | float) < (cpu_ct | float) else 'Warning' %}
          <p><strong>{{ host }}</strong> — Load Avg (1/5/15m): {{ data.health_report.load_avg }} | CPU Count: {{ cpu_ct }} | Status: <span style="{{ 'color:#ffffff;background-color:#2e7d32;font-weight:bold;padding:2px 8px;border-radius:4px;' if load_status == 'OK' else 'color:#ffffff;background-color:#c62828;font-weight:bold;padding:2px 8px;border-radius:4px;' }}">{{ load_status }}</span></p>
          {% if data.health_report.podman_stats %}
          <pre>
          {% for line in data.health_report.podman_stats %}
          {{ line }}
          {% endfor %}
          </pre>
          {% endif %}
          {% endfor %}
          <hr>
          <!-- ========================= -->
          <!--   PER-HOST DETAILED DATA  -->
          <!-- ========================= -->
          {% for host, data in all_reports.items() %}
          <div class="host-section">
              <h2>Host: {{ host }}</h2>
              <h3>Disk Usage</h3>
              <pre>
          {% for line in data.health_report.disk %}
          {{ line }}
          {% endfor %}
              </pre>
              <h3>Memory Usage</h3>
              <pre>
          {% for line in data.health_report.memory %}
          {{ line }}
          {% endfor %}
              </pre>
              <h3>Uptime</h3>
              <pre>{{ data.health_report.uptime }}</pre>
              <h3>Running Podman Containers</h3>
              {% if data.health_report.podman %}
              <pre>
          {% for line in data.health_report.podman %}
          {{ line }}
          {% endfor %}
              </pre>
              {% else %}
              <p>No running containers.</p>
              {% endif %}
              <h3>SSSD Logs (Last 1 Hour)</h3>
              {% if data.health_report.sssd_logs %}
              <pre>
          {% for line in data.health_report.sssd_logs %}
          {{ line }}
          {% endfor %}
              </pre>
              {% else %}
              <p>No recent SSSD log entries.</p>
              {% endif %}
              <hr>
          </div>
          {% endfor %}
          </body>
          </html>

    - name: Ensure local report directory exists
      file:
        path: "{{ report_local_dir }}"
        state: directory
        mode: '0755'

    - name: Write consolidated HTML report to disk
      copy:
        content: "{{ html_report }}"
        dest: "{{ report_file }}"
        mode: '0644'

    - name: Send report email
      community.general.mail:
        host:     "smtp.gmail.com"
        port:     587
        username: "{{ gmail_user }}"
        password: "{{ gmail_password }}"
        sender:   "{{ gmail_user }}"
        to:       "{{ recipient }}"
        subject:  "Audit Report — {{ total_hosts }} hosts — {{ ansible_date_time.date }} {{ ansible_date_time.time }}"
        body: "Consolidated audit report attached. {{ total_hosts }} host(s) reported."
        attach:
          - "{{ html_file_path }}"
      ignore_errors: true
