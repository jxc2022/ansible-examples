# ---------------------------------------------------------
# PLAY 1 — Dynamic Inventory (single server list)
# ---------------------------------------------------------
- name: Build dynamic inventory
  hosts: localhost
  gather_facts: no

  vars:
    server_list: |
      192.168.1.60

  tasks:

    - name: Convert server_list string to a list
      set_fact:
        servers: "{{ server_list.split('\n')
                     | map('trim')
                     | select('ne','')
                     | unique
                     | list }}"

    - name: Create dynamic group linux_servers
      add_host:
        name: "{{ item }}"
        groups: linux_servers
      loop: "{{ servers }}"

    - name: Show dynamically added servers
      debug:
        msg: "Added {{ servers }} to group linux_servers"


# ---------------------------------------------------------
# PLAY 2 — Collect health data
# ---------------------------------------------------------
- name: Collect health data from RHEL servers
  hosts: linux_servers
  become: yes
  gather_facts: yes

  tasks:

    - name: Check disk space
      command: df -h
      register: disk_output

    - name: Check free memory
      command: free -h
      register: mem_output

    - name: Check uptime
      command: uptime -p
      register: uptime_output

    - name: Check running Podman containers as aap user
      become_user: aap
      command: podman ps --format "table {{ '{{.Names}}' }}\t{{ '{{.Status}}' }}\t{{ '{{.Image}}' }}"
      register: podman_output
      ignore_errors: yes

    # -----------------------------------------------------
    # SSSD LOG COLLECTION (last 1 hour)
    # -----------------------------------------------------
    - name: Collect recent SSSD errors
      command: journalctl -u sssd --since "1 hour ago"
      register: sssd_logs
      ignore_errors: yes

    # -----------------------------------------------------
    # Consolidate host facts
    # -----------------------------------------------------
    - name: Set host facts for report
      set_fact:
        health_report:
          disk: "{{ disk_output.stdout_lines }}"
          memory: "{{ mem_output.stdout_lines }}"
          uptime: "{{ uptime_output.stdout }}"
          podman: "{{ (podman_output.stdout_lines | default([]))[1:] if (podman_output.stdout_lines | default([]) | length > 0) else [] }}"
          sssd_logs: "{{ sssd_logs.stdout_lines | default([]) }}"


# ---------------------------------------------------------
# PLAY 3 — Build HTML report and send email (inline template)
# ---------------------------------------------------------
- name: Build and email consolidated HTML report
  hosts: localhost
  gather_facts: yes

  vars:
    report_file:      "/tmp/prod_aap.html"
    html_file_path:   "/tmp/prod_aap.html"
    recipient:        "{{ recipient | mandatory }}"
    gmail_user:       "jorge.x.chavez@gmail.com"
    gmail_password:   "nnmk dzsm ylgf tsur"
    report_local_dir: "/tmp/reports"
    aap_api_base:     "https://aap.molly.lab:8448/api/controller/v2"
    aap_token:        "6fXfwf7Au4ZdyT3wzqHyOe1XkpcjRa"

  tasks:

    # -----------------------------------------------------
    # Query AAP platform version / patch level
    # -----------------------------------------------------
    - name: Query AAP ping endpoint for version info
      uri:
        url: "{{ aap_api_base }}/ping/"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: no
        return_content: yes
      register: aap_ping
      ignore_errors: yes

    - name: Query AAP config endpoint for license/patch info
      uri:
        url: "{{ aap_api_base }}/config/"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: no
        return_content: yes
      register: aap_config
      ignore_errors: yes

    - name: Set AAP version facts
      set_fact:
        aap_version: "{{ aap_config.json.version | default(aap_ping.json.version) | default('Unavailable') }}"
        aap_node_versions: "{{ aap_ping.json.instances | default([]) | map(attribute='version') | default([]) | list }}"

    # -----------------------------------------------------
    # Gather all host health data — hostname -> full hostvars
    # (template below expects data.health_report.*, so we
    # keep the whole hostvars entry per host, not just the
    # nested health_report dict)
    # -----------------------------------------------------
    - name: Gather all host health data
      set_fact:
        all_reports: >-
          {{
            hostvars
            | dict2items
            | selectattr('value.health_report', 'defined')
            | items2dict(key_name='key', value_name='value')
          }}

    - name: Compute summary counts
      set_fact:
        total_hosts: "{{ all_reports | length }}"

    # -----------------------------------------------------
    # Inline HTML report — no external .j2 file needed
    # (ported from consolidated_report.j2)
    # -----------------------------------------------------
    - name: Render consolidated HTML report inline
      set_fact:
        html_report: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>AAP Consolidated Health Report</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 20px; }
                  h1 { color: #2a4d69; }
                  h2 { color: #4b86b4; }
                  h3 { color: #1b3c59; }
                  pre { background: #f4f4f4; padding: 10px; border-radius: 5px; }
                  table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
                  th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
                  th { background-color: #e8eef3; }
                  .host-section { margin-bottom: 40px; }
              </style>
          </head>
          <body>
          <h1>AAP Consolidated Health Report</h1>
          <p>Generated on {{ ansible_date_time.date }} at {{ ansible_date_time.time }}</p>
          <p><strong>AAP Version:</strong> {{ aap_version }}
             {% if aap_node_versions %} | <strong>Node Patch Levels:</strong> {{ aap_node_versions | join(', ') }}{% endif %}
          </p>
          <hr>
          <!-- ========================= -->
          <!--      SUMMARY TABLE        -->
          <!-- ========================= -->
          <h2>Summary</h2>
          <table>
              <tr>
                  <th>Host</th>
                  <th>Max Disk Usage</th>
                  <th>Status</th>
                  <th>Podman Containers</th>
                  <th>Uptime</th>
                  <th>SSSD Health</th>
              </tr>
              {% for host, data in all_reports.items() %}
              {% set max_disk = (data.health_report.disk | map('regex_search', '\\d+%') | select('string') | list) %}
              {% set max_disk_val = (max_disk | map('replace', '%', '') | map('int') | max) %}
              {% set status = 'OK' if max_disk_val < 75 else 'Warning' %}
              {% set sssd_status = 'OK' if (data.health_report.sssd_logs | length == 0 or (data.health_report.sssd_logs | length == 1 and 'No entries' in data.health_report.sssd_logs[0])) else 'Warning' %}
              <tr>
                  <td>{{ host }}</td>
                  <td>{{ max_disk_val }}%</td>
                  <td>{{ status }}</td>
                  <td>{{ data.health_report.podman | length }}</td>
                  <td>{{ data.health_report.uptime }}</td>
                  <td>{{ sssd_status }}</td>
              </tr>
              {% endfor %}
          </table>
          <hr>
          <!-- ========================= -->
          <!--   PER-HOST DETAILED DATA  -->
          <!-- ========================= -->
          {% for host, data in all_reports.items() %}
          <div class="host-section">
              <h2>Host: {{ host }}</h2>
              <h3>Disk Usage</h3>
              <pre>
          {% for line in data.health_report.disk %}
          {{ line }}
          {% endfor %}
              </pre>
              <h3>Memory Usage</h3>
              <pre>
          {% for line in data.health_report.memory %}
          {{ line }}
          {% endfor %}
              </pre>
              <h3>Uptime</h3>
              <pre>{{ data.health_report.uptime }}</pre>
              <h3>Running Podman Containers</h3>
              {% if data.health_report.podman %}
              <pre>
          {% for line in data.health_report.podman %}
          {{ line }}
          {% endfor %}
              </pre>
              {% else %}
              <p>No running containers.</p>
              {% endif %}
              <h3>SSSD Logs (Last 1 Hour)</h3>
              {% if data.health_report.sssd_logs %}
              <pre>
          {% for line in data.health_report.sssd_logs %}
          {{ line }}
          {% endfor %}
              </pre>
              {% else %}
              <p>No recent SSSD log entries.</p>
              {% endif %}
              <hr>
          </div>
          {% endfor %}
          </body>
          </html>

    - name: Ensure local report directory exists
      file:
        path: "{{ report_local_dir }}"
        state: directory
        mode: '0755'

    - name: Write consolidated HTML report to disk
      copy:
        content: "{{ html_report }}"
        dest: "{{ report_file }}"
        mode: '0644'

    - name: Send report email
      community.general.mail:
        host:     "smtp.gmail.com"
        port:     587
        username: "{{ gmail_user }}"
        password: "{{ gmail_password }}"
        sender:   "{{ gmail_user }}"
        to:       "{{ recipient }}"
        subject:  "Audit Report — {{ total_hosts }} hosts — {{ ansible_date_time.date }} {{ ansible_date_time.time }}"
        body: "Consolidated audit report attached. {{ total_hosts }} host(s) reported."
        attach:
          - "{{ html_file_path }}"
      ignore_errors: true