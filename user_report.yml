- name: Gather info for {{ target_user }} on all hosts
  hosts: all
  gather_facts: true
  become: true
  ignore_unreachable: true

  vars:
    target_user: "{{ target_user | mandatory }}"


  tasks:

    # ----------------------------------------------------------
    # 1. CONNECTIVITY CHECK
    # ----------------------------------------------------------
    - name: Ping host to verify connectivity
      ansible.builtin.ping:
      register: ping_result
      

    - name: Record connectivity status
      ansible.builtin.set_fact:
        connectivity_status: "{{ 'SUCCESS' if (ping_result.ping | default('')) == 'pong' else 'FAILED' }}"
        connectivity_time:   "{{ ansible_date_time.iso8601 | default('N/A') }}"

    # ----------------------------------------------------------
    # 2. GATHER USER INFO
    # ----------------------------------------------------------
    - name: Check if user {{ target_user }} exists
      ansible.builtin.getent:
        database: passwd
        key: "{{ target_user }}"
      register: user_getent
      failed_when: false

    - name: Run id command for {{ target_user }}
      ansible.builtin.command: "id {{ target_user }}"
      register: user_id_result
      changed_when: false
      failed_when: false

    - name: Get password aging info
      ansible.builtin.command: "chage -l {{ target_user }}"
      register: user_chage_result
      changed_when: false
      failed_when: false

    - name: Get last login
      ansible.builtin.command: "lastlog -u {{ target_user }}"
      register: user_lastlog_result
      changed_when: false
      failed_when: false

    - name: Get shell / passwd entry
      ansible.builtin.command: "getent passwd {{ target_user }}"
      register: user_shell_result
      changed_when: false
      failed_when: false

    # ----------------------------------------------------------
    # 3. AGGREGATE PER-HOST RESULTS INTO HOSTVARS
    # ----------------------------------------------------------
    - name: Aggregate per-host results into hostvars
      ansible.builtin.set_fact:
        user_host_report:
          hostname:          "{{ inventory_hostname }}"
          fqdn:              "{{ ansible_fqdn | default('N/A') }}"
          ip:                "{{ ansible_default_ipv4.address | default('N/A') }}"
          os:                "{{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_distribution_release }})"
          target_user:       "{{ target_user }}"
          connectivity:      "{{ connectivity_status }}"
          connectivity_time: "{{ connectivity_time }}"
          ping_response:     "{{ ping_result.ping | default('none') }}"
          auth_status:       "SUCCESS"
          user_exists:       "{{ 'YES' if user_getent.ansible_facts is defined else 'NO' }}"
          id_output:         "{{ user_id_result.stdout | default('user not found') }}"
          passwd_entry:      "{{ user_shell_result.stdout | default('N/A') }}"
          last_login:        "{{ user_lastlog_result.stdout_lines[-1] | default('N/A') }}"
          chage_info:        "{{ user_chage_result.stdout | default('N/A') }}"


# ==============================================================
# PLAY 2 — localhost only: report + email
# ==============================================================
- name: Build report and send email — localhost
  hosts: localhost
  gather_facts: true
  become: false

  vars:
    recipient: "jorge.x.chavez@gmail.com"
    gmail_user: "jorge.x.chavez@gmail.com"
    gmail_password: "nnmk dzsm ylgf tsur"
    report_local_dir: "/tmp/reports"
  tasks:

    - name: Set run timestamp
      ansible.builtin.set_fact:
        run_ts: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

    - name: Set report path from frozen timestamp
      ansible.builtin.set_fact:
        aggregated_report_path: "{{ report_local_dir }}/{{ target_user }}_all_hosts_{{ run_ts }}.html"

    # ----------------------------------------------------------
    # 1. COLLECT ALL HOST REPORTS + COMPUTE SUMMARY
    # ----------------------------------------------------------
    - name: Ensure local reports directory exists
      ansible.builtin.file:
        path:  "{{ report_local_dir }}"
        state: directory
        mode:  '0755'

    - name: Collect reports for hosts that ran successfully
      ansible.builtin.set_fact:
        all_host_reports: >-
          {{ groups['all'] | map('extract', hostvars, 'user_host_report') | select('defined') | list }}

    - name: Add stub report for unreachable / auth-failed hosts
      ansible.builtin.set_fact:
        all_host_reports: "{{ all_host_reports + [stub] }}"
      vars:
        _raw_msg: >-
          {{ hostvars[item].get('ansible_failed_result', {}).get('msg', '')
             | default('') }}
        _auth_keywords:
          - "Permission denied"
          - "Authentication failed"
          - "Invalid/incorrect password"
          - "Host key verification failed"
          - "Failed to authenticate"
          - "No authentication methods"
          - "Bad authentication"
          - "publickey,password"
        _is_auth_fail: >-
          {{ _auth_keywords | select('in', _raw_msg) | list | length > 0 }}
        stub:
          hostname:          "{{ item }}"
          fqdn:              "N/A"
          ip:                "{{ hostvars[item].ansible_host | default(item) }}"
          os:                "N/A"
          target_user:       "{{ target_user }}"
          connectivity:      "{{ 'SUCCESS' if _is_auth_fail else 'UNREACHABLE' }}"
          connectivity_time: "N/A"
          ping_response:     "none"
          auth_status:       "{{ 'FAILED' if _is_auth_fail else 'N/A' }}"
          auth_fail_msg:     "{{ _raw_msg if _is_auth_fail else '' }}"
          user_exists:       "N/A"
          id_output:         "N/A"
          passwd_entry:      "N/A"
          last_login:        "N/A"
          chage_info:        "N/A"
      loop: "{{ groups['all'] }}"
      when: hostvars[item]['user_host_report'] is not defined

    - name: Compute aggregated summary counts
      ansible.builtin.set_fact:
        total_hosts:       "{{ all_host_reports | length }}"
        hosts_connected:   "{{ all_host_reports | selectattr('connectivity', 'equalto', 'SUCCESS')     | list | length }}"
        hosts_unreachable: "{{ all_host_reports | selectattr('connectivity', 'equalto', 'UNREACHABLE') | list | length }}"
        hosts_auth_failed: "{{ all_host_reports | selectattr('auth_status',  'equalto', 'FAILED')      | list | length }}"
        hosts_user_found:  "{{ all_host_reports | selectattr('user_exists',  'equalto', 'YES')         | list | length }}"

    # ----------------------------------------------------------
    # 2. RENDER AGGREGATED HTML REPORT
    # ----------------------------------------------------------
    - name: Render aggregated HTML report on localhost
      ansible.builtin.copy:
        dest: "{{ aggregated_report_path }}"
        mode: '0644'
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
            <title>Ansible Report — {{ target_user }} — {{ run_ts }}</title>
            <style>
              :root {
                --bg:      #0f1117; --surface: #1a1d27; --border: #2a2d3e;
                --accent:  #4f8ef7; --green:   #34d399; --red:    #f87171;
                --yellow:  #fbbf24; --orange:  #fb923c; --text:   #e2e8f0;
                --muted:   #64748b;
                --mono: 'JetBrains Mono','Fira Code','Courier New',monospace;
                --sans: 'Inter',system-ui,sans-serif;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.6; padding: 2rem; }
              .page-header { border-left: 4px solid var(--accent); padding-left: 1.25rem; margin-bottom: 2.5rem; }
              .page-header .eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: .4rem; }
              .page-header h1 { font-size: 1.75rem; font-weight: 700; }
              .page-header .meta { color: var(--muted); font-size: 13px; margin-top: .35rem; }
              .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2.5rem; }
              .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; }
              .stat-card .title { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: .4rem; }
              .stat-card .value { font-size: 1.6rem; font-weight: 700; }
              .stat-card .value.green  { color: var(--green);  }
              .stat-card .value.red    { color: var(--red);    }
              .stat-card .value.blue   { color: var(--accent); }
              .stat-card .value.yellow { color: var(--yellow); }
              .overview-section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 2rem; overflow: hidden; }
              .section-title { background: var(--border); padding: .65rem 1.25rem; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
              .overview-table { width: 100%; border-collapse: collapse; }
              .overview-table th, .overview-table td { padding: .55rem 1rem; font-size: 13px; border-bottom: 1px solid var(--border); text-align: left; }
              .overview-table th { color: var(--muted); font-weight: 500; background: var(--surface); }
              .overview-table tr:last-child td { border-bottom: none; }
              .overview-table tr:hover td { background: rgba(79,142,247,.04); }
              .host-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 2rem; overflow: hidden; }
              .host-card-header { display: flex; align-items: center; gap: .75rem; padding: .9rem 1.25rem; background: var(--border); }
              .host-card-header h2 { font-size: 1rem; font-weight: 700; }
              .host-card-header .sub { color: var(--muted); font-size: 12px; }
              .host-body { padding: 1.25rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
              @media (max-width: 700px) { .host-body { grid-template-columns: 1fr; } }
              .host-section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: .6rem; font-weight: 600; }
              .kv-table { width: 100%; border-collapse: collapse; }
              .kv-table th, .kv-table td { padding: .4rem .6rem; font-size: 12px; border-bottom: 1px solid var(--border); text-align: left; }
              .kv-table th { color: var(--muted); font-weight: 500; width: 45%; }
              .kv-table td { font-family: var(--mono); word-break: break-all; }
              .kv-table tr:last-child th, .kv-table tr:last-child td { border-bottom: none; }
              .host-section.full { grid-column: 1 / -1; }
              pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: .85rem 1rem; font-family: var(--mono); font-size: 11px; white-space: pre-wrap; word-break: break-word; margin-top: .5rem; }
              .badge { display: inline-block; padding: .12rem .55rem; border-radius: 999px; font-size: 11px; font-weight: 600; }
              .badge-green  { background: rgba(52,211,153,.15);  color: var(--green);  }
              .badge-red    { background: rgba(248,113,113,.15); color: var(--red);    }
              .badge-yellow { background: rgba(251,191,36,.15);  color: var(--yellow); }
              .badge-orange { background: rgba(251,146,60,.15);  color: var(--orange); }
              .badge-blue   { background: rgba(79,142,247,.15);  color: var(--accent); }
              .alert-box { margin-top: .75rem; padding: .65rem .85rem; border-radius: 6px; font-size: 12px; }
              .alert-orange { background: rgba(251,146,60,.08); border: 1px solid rgba(251,146,60,.25); color: var(--orange); }
              .alert-red    { background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.25); color: var(--red); }
              footer { margin-top: 3rem; text-align: center; color: var(--muted); font-size: 12px; }
            </style>
          </head>
          <body>

            <div class="page-header">
              <div class="eyebrow">Ansible Automation — Aggregated Report</div>
              <h1>User Info Report — <code>{{ target_user }}</code></h1>
              <div class="meta">
                Generated: <strong>{{ ansible_date_time.iso8601 }}</strong>
                &nbsp;·&nbsp; Hosts targeted: <strong>{{ total_hosts }}</strong>
              </div>
            </div>

            <!-- Summary Cards -->
            <div class="summary-grid">
              <div class="stat-card">
                <div class="title">Total Hosts</div>
                <div class="value blue">{{ total_hosts }}</div>
              </div>
              <div class="stat-card">
                <div class="title">Connected</div>
                <div class="value {{ 'green' if hosts_connected | int == total_hosts | int else 'red' }}">{{ hosts_connected }} / {{ total_hosts }}</div>
              </div>
              <div class="stat-card">
                <div class="title">Unreachable</div>
                <div class="value {{ 'red' if hosts_unreachable | int > 0 else 'green' }}">{{ hosts_unreachable }}</div>
              </div>
              <div class="stat-card">
                <div class="title">Auth Failures</div>
                <div class="value {{ 'orange' if hosts_auth_failed | int > 0 else 'green' }}">{{ hosts_auth_failed }}</div>
              </div>
              <div class="stat-card">
                <div class="title">User Found</div>
                <div class="value {{ 'green' if hosts_user_found | int == total_hosts | int else 'yellow' }}">{{ hosts_user_found }} / {{ total_hosts }}</div>
              </div>
            </div>

            <!-- Overview Table -->
            <div class="overview-section">
              <div class="section-title">All Hosts — At a Glance</div>
              <table class="overview-table">
                <thead>
                  <tr>
                    <th>Hostname</th>
                    <th>IP</th>
                    <th>OS</th>
                    <th>Connectivity</th>
                    <th>Auth</th>
                    <th>User Exists</th>
                    <th>Last Login</th>
                  </tr>
                </thead>
                <tbody>
                  {% for h in all_host_reports %}
                  <tr>
                    <td><strong>{{ h.hostname }}</strong></td>
                    <td>{{ h.ip }}</td>
                    <td>{{ h.os }}</td>
                    <td>
                      <span class="badge {{ 'badge-green' if h.connectivity == 'SUCCESS' else 'badge-red' }}">
                        {{ h.connectivity }}
                      </span>
                    </td>
                    <td>
                      <span class="badge
                        {% if h.auth_status == 'SUCCESS' %}badge-green
                        {% elif h.auth_status == 'FAILED' %}badge-orange
                        {% else %}badge-yellow{% endif %}">
                        {{ h.auth_status }}
                      </span>
                    </td>
                    <td>
                      <span class="badge
                        {% if h.user_exists == 'YES' %}badge-green
                        {% elif h.user_exists == 'NO' %}badge-red
                        {% else %}badge-yellow{% endif %}">
                        {{ h.user_exists }}
                      </span>
                    </td>
                    <td>{{ h.last_login }}</td>
                  </tr>
                  {% endfor %}
                </tbody>
              </table>
            </div>

            <!-- Per-host detail cards -->
            {% for h in all_host_reports %}
            <div class="host-card">
              <div class="host-card-header">
                <div>
                  <h2>{{ h.hostname }}</h2>
                  <div class="sub">{{ h.fqdn }} &nbsp;·&nbsp; {{ h.ip }}</div>
                </div>
                <span class="badge
                  {% if h.connectivity == 'UNREACHABLE' %}badge-red
                  {% elif h.auth_status == 'FAILED' %}badge-orange
                  {% elif h.user_exists == 'YES' %}badge-green
                  {% else %}badge-yellow{% endif %}"
                  style="margin-left:auto">
                  {{ 'UNREACHABLE' if h.connectivity == 'UNREACHABLE' else
                     'AUTH FAILED'  if h.auth_status == 'FAILED' else
                     'USER FOUND'   if h.user_exists == 'YES' else 'USER NOT FOUND' }}
                </span>
              </div>

              <div class="host-body">

                <!-- SECTION 1: Connectivity -->
                <div class="host-section">
                  <h3>1 · Connectivity</h3>
                  <table class="kv-table">
                    <tr><th>Status</th><td>{{ h.connectivity }}</td></tr>
                    <tr><th>Check Time</th><td>{{ h.connectivity_time }}</td></tr>
                    <tr><th>Ping Response</th><td>{{ h.ping_response }}</td></tr>
                    <tr><th>IP Address</th><td>{{ h.ip }}</td></tr>
                    <tr><th>FQDN</th><td>{{ h.fqdn }}</td></tr>
                  </table>
                  {% if h.connectivity == 'UNREACHABLE' %}
                  <div class="alert-box alert-red">
                    Host is unreachable — verify the IP/hostname in inventory, check firewall rules, and confirm the host is powered on.
                  </div>
                  {% endif %}
                </div>

                <!-- SECTION 2: Authentication -->
                <div class="host-section">
                  <h3>2 · Authentication</h3>
                  <table class="kv-table">
                    <tr>
                      <th>Auth Status</th>
                      <td>
                        <span class="badge
                          {% if h.auth_status == 'SUCCESS' %}badge-green
                          {% elif h.auth_status == 'FAILED' %}badge-orange
                          {% else %}badge-yellow{% endif %}">
                          {{ h.auth_status }}
                        </span>
                      </td>
                    </tr>
                    {% if h.auth_status == 'FAILED' and h.auth_fail_msg | default('') %}
                    <tr><th>Failure Detail</th><td>{{ h.auth_fail_msg }}</td></tr>
                    {% endif %}
                  </table>
                  {% if h.auth_status == 'FAILED' %}
                  <div class="alert-box alert-orange">
                    Credentials were rejected by this host. Check the credential assigned
                    to this job template, verify the SSH key or password is correct, and
                    confirm the service account is not locked or expired.
                  </div>
                  {% elif h.connectivity == 'UNREACHABLE' %}
                  <div class="alert-box alert-red">
                    Authentication could not be attempted — host was unreachable.
                  </div>
                  {% endif %}
                </div>

                {% if h.connectivity != 'UNREACHABLE' and h.auth_status != 'FAILED' %}

                <!-- SECTION 3: User Identity -->
                <div class="host-section">
                  <h3>3 · User Identity — {{ h.target_user }}</h3>
                  <table class="kv-table">
                    <tr><th>Username</th><td>{{ h.target_user }}</td></tr>
                    <tr><th>User Exists</th><td>{{ h.user_exists }}</td></tr>
                    <tr><th>id output</th><td>{{ h.id_output }}</td></tr>
                    <tr><th>passwd entry</th><td>{{ h.passwd_entry }}</td></tr>
                    <tr><th>Last Login</th><td>{{ h.last_login }}</td></tr>
                  </table>
                </div>

                <!-- SECTION 4: OS Info -->
                <div class="host-section">
                  <h3>4 · System Info</h3>
                  <table class="kv-table">
                    <tr><th>OS</th><td>{{ h.os }}</td></tr>
                    <tr><th>FQDN</th><td>{{ h.fqdn }}</td></tr>
                    <tr><th>IP</th><td>{{ h.ip }}</td></tr>
                  </table>
                </div>

                <!-- SECTION 5: Password Aging Info -->
                <div class="host-section full">
                  <h3>5 · Password Aging Info</h3>
                  <pre>{{ h.chage_info }}</pre>
                </div>

                {% elif h.user_exists == 'NO' %}
                <div class="host-section full" style="color:var(--muted);font-size:13px;padding:.5rem 0">
                  User <strong>{{ h.target_user }}</strong> was not found on this host.
                </div>
                {% endif %}

              </div>
            </div>
            {% endfor %}

            <footer>
              Generated by Ansible on localhost &nbsp;·&nbsp; {{ ansible_date_time.iso8601 }}
              &nbsp;·&nbsp; {{ total_hosts }} host(s) · user: {{ target_user }}
            </footer>

          </body>
          </html>

    # ----------------------------------------------------------
    # CSV REPORT
    # ----------------------------------------------------------
    - name: Render CSV report on localhost
      ansible.builtin.copy:
        dest: "{{ report_local_dir }}/{{ target_user }}_all_hosts_{{ run_ts }}.csv"
        mode: '0644'
        content: |
          Hostname,IP,OS,Connectivity,Auth Status,User Exists,ID Output,Last Login
          {% for h in all_host_reports %}
          "{{ h.hostname }}","{{ h.ip }}","{{ h.os }}","{{ h.connectivity }}","{{ h.auth_status }}","{{ h.user_exists }}","{{ h.id_output }}","{{ h.last_login }}"
          {% endfor %}

    - name: Print aggregated report location
      ansible.builtin.debug:
        msg: "✅ Aggregated report saved to: {{ aggregated_report_path }}"

    # ----------------------------------------------------------
    # 3. SEND EMAIL
    # ----------------------------------------------------------
    - name: Send aggregated report email from localhost
      community.general.mail:
        host:     "smtp.gmail.com"
        port:     587
        username: "{{ gmail_user }}"
        password: "{{ gmail_password }}"
        to:       "{{ recipient }}"
        subject:  "User Info Report — {{ target_user }} — {{ total_hosts }} hosts — {{ run_ts }}"
        body: |
          Ansible user info report for '{{ target_user }}' across {{ total_hosts }} host(s).

          ── Aggregated Summary ───────────────────────────────
          Target User   : {{ target_user }}
          Total Hosts   : {{ total_hosts }}
          Connected     : {{ hosts_connected }} / {{ total_hosts }}
          Unreachable   : {{ hosts_unreachable }}
          Auth Failures : {{ hosts_auth_failed }}
          User Found    : {{ hosts_user_found }} / {{ total_hosts }}
          ─────────────────────────────────────────────────────

          {% for h in all_host_reports %}
          Host : {{ h.hostname }} ({{ h.ip }})
            Connectivity : {{ h.connectivity }}
            Auth Status  : {{ h.auth_status }}
            User Exists  : {{ h.user_exists }}
            id output    : {{ h.id_output }}
            Last Login   : {{ h.last_login }}
          {% if h.auth_status == 'FAILED' and h.auth_fail_msg | default('') %}
            Auth Error   : {{ h.auth_fail_msg }}
          {% endif %}

          {% endfor %}
          Full details are in the attached HTML report.
        secure: starttls
        attach:
          - "{{ aggregated_report_path }}"
          - "{{ report_local_dir }}/{{ target_user }}_all_hosts_{{ run_ts }}.csv"

    - name: Confirm email sent
      ansible.builtin.debug:
        msg: "✅ Report emailed to {{ recipient }} — {{ total_hosts }} host(s) — user: {{ target_user }}"
