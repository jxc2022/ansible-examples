- name: Patch Millennium and report
  hosts: 192.168.1.66
  gather_facts: false
  become: true
  vars:
    tomcat_url: "http://192.168.1.66:8080/"
    tomcat_service: tomcat
    screenshot_dir: "/tmp"
    report_dir: "/tmp"
    recipient: "jorge.x.chavez@gmail.com"
    gmail_user: "jorge.x.chavez@gmail.com"
    gmail_password: "nnmk dzsm ylgf tsur"
    screenshot_script: "/tmp/take_screenshot.py"

  tasks:
    - name: Gather facts for timestamp
      ansible.builtin.setup:
        gather_subset: ["date_time"]

    - name: Build BEFORE timestamp
      ansible.builtin.set_fact:
        ts: "{{ ansible_date_time.iso8601_basic | regex_replace('T','_') | regex_replace('Z','') }}"

    - name: Copy screenshot script to EE
      ansible.builtin.copy:
        src: "scripts/take_screenshot.py"
        dest: "{{ screenshot_script }}"
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Take BEFORE screenshot
      ansible.builtin.command:
        cmd: python3 {{ screenshot_script }}
      environment:
        WEBURL: "{{ tomcat_url }}"
        SCREENSHOT_PATH: "{{ screenshot_dir }}/tomcat_before_{{ ts }}.png"
      delegate_to: localhost
      run_once: true

    - name: Stop Tomcat
      ansible.builtin.systemd:
        name: "{{ tomcat_service }}"
        state: stopped

    - name: Apply OS patches
      ansible.builtin.dnf:
        name: "*"
        state: latest
      register: patch_result

    - name: Reboot server
      ansible.builtin.reboot:
        reboot_timeout: 600

    - name: Wait for connection after reboot
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts for AFTER timestamp
      ansible.builtin.setup:
        gather_subset: ["date_time"]

    - name: Build AFTER timestamp
      ansible.builtin.set_fact:
        ts_after: "{{ ansible_date_time.iso8601_basic | regex_replace('T','_') | regex_replace('Z','') }}"

    - name: Start Tomcat
      ansible.builtin.systemd:
        name: "{{ tomcat_service }}"
        state: started

    - name: Wait for Tomcat port 8080
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 8080
        delay: 10
        timeout: 90

    - name: Verify Tomcat HTTP response
      ansible.builtin.uri:
        url: "{{ tomcat_url }}"
        status_code: 200
        timeout: 30
      register: tomcat_health
      retries: 5
      delay: 10
      until: tomcat_health.status == 200
      delegate_to: localhost

    - name: Take AFTER screenshot
      ansible.builtin.command:
        cmd: python3 {{ screenshot_script }}
      environment:
        WEBURL: "{{ tomcat_url }}"
        SCREENSHOT_PATH: "{{ screenshot_dir }}/tomcat_after_{{ ts_after }}.png"
      delegate_to: localhost
      run_once: true

    - name: Build HTML patch report
      ansible.builtin.copy:
        dest: "{{ report_dir }}/patch_report_{{ inventory_hostname }}_{{ ts_after }}.html"
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Patch Report - {{ inventory_hostname }} - {{ ts_after }}</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 20px; }
              h1, h2, h3 { color: #333; }
              pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
              .ok { color: green; } .fail { color: red; }
            </style>
          </head>
          <body>
            <h1>Patch Report - {{ ts_after }}</h1>
            <h2>Host: {{ inventory_hostname }}</h2>
            <h3>Timestamps</h3>
            <ul>
              <li><strong>Before patch:</strong> {{ ts }}</li>
              <li><strong>After patch:</strong> {{ ts_after }}</li>
            </ul>
            <h3>Summary</h3>
            <ul>
              <li><strong>Changed:</strong>
                <span class="{{ 'ok' if patch_result.changed else '' }}">
                  {{ patch_result.changed }}
                </span>
              </li>
              <li><strong>Tomcat health after patch:</strong>
                <span class="{{ 'ok' if tomcat_health.status == 200 else 'fail' }}">
                  HTTP {{ tomcat_health.status }}
                </span>
              </li>
            </ul>
            <h3>Packages updated</h3>
            <pre>{{ patch_result.results | default([]) | join('\n') }}</pre>
          </body>
          </html>
      delegate_to: localhost

    - name: Email report per host
      community.general.mail:
        host: "smtp.gmail.com"
        port: 587
        username: "{{ gmail_user }}"
        password: "{{ gmail_password }}"
        to: "{{ recipient }}"
        subject: "Tomcat Patch Report - {{ inventory_hostname }} - {{ ts_after }}"
        body: |
          Patching completed for {{ inventory_hostname }}.
          Tomcat health check: HTTP {{ tomcat_health.status }}
          Before patch: {{ ts }}
          After patch: {{ ts_after }}

          Attached: before/after screenshots and HTML report.
        secure: starttls
        attach:
          - "{{ screenshot_dir }}/tomcat_before_{{ ts }}.png"
          - "{{ screenshot_dir }}/tomcat_after_{{ ts_after }}.png"
          - "{{ report_dir }}/patch_report_{{ inventory_hostname }}_{{ ts_after }}.html"
      delegate_to: localhost