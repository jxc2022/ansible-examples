---
# =============================================================
# Playbook: manage_jorge.yml
# Description: Checks connectivity, gathers info on user 'jorge',
#              changes password (no forced change on next login),
#              and generates an HTML report.
# Usage:
#   ansible-playbook manage_jorge.yml -i inventory.ini \
#     --extra-vars "jorge_new_password=SuperSecret123!"
# =============================================================

- name: Jorge User Management & HTML Report
  hosts: all
  gather_facts: true
  become: true

  vars:
    jorge_new_password: "{{ jorge_new_password | mandatory }}"  # pass via --extra-vars or vault
    report_local_dir: "./reports"
    report_path: "{{ report_local_dir }}/jorge_report_{{ inventory_hostname }}.html"
    # --- Email vars (pass via --extra-vars or Ansible Vault) ---
    gmail_user: "{{ gmail_user | mandatory }}"
    gmail_password: "{{ gmail_password | mandatory }}"
    recipient: "{{ recipient | mandatory }}"

  tasks:

    # ----------------------------------------------------------
    # 1. CONNECTIVITY CHECK
    # ----------------------------------------------------------
    - name: Ping host to verify connectivity
      ansible.builtin.ping:
      register: ping_result

    - name: Record connectivity status
      ansible.builtin.set_fact:
        connectivity_status: "{{ 'SUCCESS' if ping_result.ping == 'pong' else 'FAILED' }}"
        connectivity_time: "{{ ansible_date_time.iso8601 }}"

    # ----------------------------------------------------------
    # 2. GATHER USER INFO — id command
    # ----------------------------------------------------------
    - name: Check if user jorge exists
      ansible.builtin.getent:
        database: passwd
        key: jorge
      register: jorge_getent
      failed_when: false

    - name: Run id command for jorge
      ansible.builtin.command: id jorge
      register: jorge_id_result
      changed_when: false
      failed_when: false

    - name: Get jorge password aging info (chage)
      ansible.builtin.command: chage -l jorge
      register: jorge_chage_result
      changed_when: false
      failed_when: false

    - name: Get jorge's home directory contents
      ansible.builtin.command: ls -la /home/jorge
      register: jorge_home_result
      changed_when: false
      failed_when: false

    - name: Get jorge's last login
      ansible.builtin.command: lastlog -u jorge
      register: jorge_lastlog_result
      changed_when: false
      failed_when: false

    - name: Check jorge's shell
      ansible.builtin.command: getent passwd jorge
      register: jorge_shell_result
      changed_when: false
      failed_when: false

    # ----------------------------------------------------------
    # 3. CHANGE PASSWORD — no forced change on next login
    # ----------------------------------------------------------
    - name: Change jorge's password
      ansible.builtin.user:
        name: jorge
        password: "{{ jorge_new_password | password_hash('sha512') }}"
        update_password: always
      register: password_change_result
      when: jorge_getent is defined and jorge_getent.ansible_facts is defined

    - name: Ensure password does NOT expire on next login (chage -d today)
      ansible.builtin.command: >
        chage -d {{ ansible_date_time.date }} jorge
      changed_when: true
      when: password_change_result is not skipped

    - name: Set minimum password age to 0 (allow immediate changes)
      ansible.builtin.command: chage -m 0 jorge
      changed_when: true
      when: password_change_result is not skipped

    - name: Set maximum password age to 99999 (effectively never expires)
      ansible.builtin.command: chage -M 99999 jorge
      changed_when: true
      when: password_change_result is not skipped

    - name: Record password change timestamp
      ansible.builtin.set_fact:
        password_changed_at: "{{ ansible_date_time.iso8601 }}"
        password_change_status: >-
          {{ 'SUCCESS' if (password_change_result is not skipped and password_change_result is not failed)
             else 'SKIPPED (user not found)' }}

    - name: Gather updated chage info post-change
      ansible.builtin.command: chage -l jorge
      register: jorge_chage_after
      changed_when: false
      failed_when: false

    # ----------------------------------------------------------
    # 4. COLLECT SYSTEM CONTEXT
    # ----------------------------------------------------------
    - name: Get OS info
      ansible.builtin.command: cat /etc/os-release
      register: os_release_result
      changed_when: false

    - name: Get uptime
      ansible.builtin.command: uptime -p
      register: uptime_result
      changed_when: false

    # ----------------------------------------------------------
    # 5. GENERATE HTML REPORT — written directly on localhost
    # ----------------------------------------------------------
    - name: Ensure local reports directory exists
      ansible.builtin.file:
        path: "{{ report_local_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: false

    - name: Render HTML report on localhost
      ansible.builtin.copy:
        dest: "{{ report_path }}"
        mode: '0644'
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
            <title>Ansible Report — jorge @ {{ inventory_hostname }}</title>
            <style>
              :root {
                --bg:       #0f1117;
                --surface:  #1a1d27;
                --border:   #2a2d3e;
                --accent:   #4f8ef7;
                --green:    #34d399;
                --red:      #f87171;
                --yellow:   #fbbf24;
                --text:     #e2e8f0;
                --muted:    #64748b;
                --mono:     'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
                --sans:     'Inter', system-ui, sans-serif;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                background: var(--bg);
                color: var(--text);
                font-family: var(--sans);
                font-size: 14px;
                line-height: 1.6;
                padding: 2rem;
              }
              header {
                border-left: 4px solid var(--accent);
                padding-left: 1.25rem;
                margin-bottom: 2.5rem;
              }
              header .label {
                font-size: 11px;
                letter-spacing: .12em;
                text-transform: uppercase;
                color: var(--muted);
                margin-bottom: .4rem;
              }
              header h1 {
                font-size: 1.75rem;
                font-weight: 700;
                color: var(--text);
              }
              header .meta {
                color: var(--muted);
                font-size: 13px;
                margin-top: .35rem;
              }
              .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 1rem;
                margin-bottom: 2rem;
              }
              .stat-card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 1rem 1.25rem;
              }
              .stat-card .title {
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: .1em;
                color: var(--muted);
                margin-bottom: .5rem;
              }
              .stat-card .value {
                font-size: 1.1rem;
                font-weight: 600;
              }
              .badge {
                display: inline-block;
                padding: .15rem .6rem;
                border-radius: 999px;
                font-size: 12px;
                font-weight: 600;
              }
              .badge-green  { background: rgba(52,211,153,.15); color: var(--green); }
              .badge-red    { background: rgba(248,113,113,.15); color: var(--red);  }
              .badge-yellow { background: rgba(251,191,36,.15);  color: var(--yellow);}
              section {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                margin-bottom: 1.5rem;
                overflow: hidden;
              }
              section header {
                background: var(--border);
                padding: .65rem 1.25rem;
                border: none;
                margin: 0;
              }
              section header h2 {
                font-size: 13px;
                text-transform: uppercase;
                letter-spacing: .1em;
                color: var(--muted);
                font-weight: 600;
              }
              .section-body { padding: 1.25rem; }
              table {
                width: 100%;
                border-collapse: collapse;
              }
              th, td {
                text-align: left;
                padding: .5rem .75rem;
                border-bottom: 1px solid var(--border);
                font-size: 13px;
              }
              th {
                color: var(--muted);
                font-weight: 500;
                width: 35%;
              }
              td { font-family: var(--mono); }
              tr:last-child th, tr:last-child td { border-bottom: none; }
              pre {
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 1rem;
                font-family: var(--mono);
                font-size: 12px;
                overflow-x: auto;
                white-space: pre-wrap;
                word-break: break-word;
                color: var(--text);
              }
              footer {
                margin-top: 2.5rem;
                text-align: center;
                color: var(--muted);
                font-size: 12px;
              }
            </style>
          </head>
          <body>

            <header>
              <div class="label">Ansible Automation Report</div>
              <h1>User Management — <code>jorge</code></h1>
              <div class="meta">
                Host: <strong>{{ inventory_hostname }}</strong> &nbsp;·&nbsp;
                Generated: <strong>{{ ansible_date_time.iso8601 }}</strong>
              </div>
            </header>

            <!-- Summary Cards -->
            <div class="grid">
              <div class="stat-card">
                <div class="title">Connectivity</div>
                <div class="value">
                  <span class="badge {{ 'badge-green' if connectivity_status == 'SUCCESS' else 'badge-red' }}">
                    {{ connectivity_status }}
                  </span>
                </div>
              </div>
              <div class="stat-card">
                <div class="title">User Exists</div>
                <div class="value">
                  <span class="badge {{ 'badge-green' if jorge_getent.ansible_facts is defined else 'badge-red' }}">
                    {{ 'YES' if jorge_getent.ansible_facts is defined else 'NO' }}
                  </span>
                </div>
              </div>
              <div class="stat-card">
                <div class="title">Password Change</div>
                <div class="value">
                  <span class="badge {{ 'badge-green' if 'SUCCESS' in password_change_status else 'badge-yellow' }}">
                    {{ password_change_status }}
                  </span>
                </div>
              </div>
              <div class="stat-card">
                <div class="title">Force Change on Login</div>
                <div class="value">
                  <span class="badge badge-green">DISABLED</span>
                </div>
              </div>
              <div class="stat-card">
                <div class="title">Target Host OS</div>
                <div class="value" style="font-size:.9rem">{{ ansible_distribution }} {{ ansible_distribution_version }}</div>
              </div>
              <div class="stat-card">
                <div class="title">Host Uptime</div>
                <div class="value" style="font-size:.9rem">{{ uptime_result.stdout }}</div>
              </div>
            </div>

            <!-- Connectivity Details -->
            <section>
              <header><h2>1 · Connectivity Check</h2></header>
              <div class="section-body">
                <table>
                  <tr><th>Status</th><td>{{ connectivity_status }}</td></tr>
                  <tr><th>Check Time</th><td>{{ connectivity_time }}</td></tr>
                  <tr><th>IP Address</th><td>{{ ansible_default_ipv4.address | default('N/A') }}</td></tr>
                  <tr><th>FQDN</th><td>{{ ansible_fqdn | default('N/A') }}</td></tr>
                  <tr><th>Ping Response</th><td>{{ ping_result.ping | default('No response') }}</td></tr>
                </table>
              </div>
            </section>

            <!-- User ID Info -->
            <section>
              <header><h2>2 · User Identity (id jorge)</h2></header>
              <div class="section-body">
                <table>
                  <tr><th>id output</th><td>{{ jorge_id_result.stdout | default('User not found') }}</td></tr>
                  <tr><th>passwd entry</th><td>{{ jorge_shell_result.stdout | default('N/A') }}</td></tr>
                  <tr><th>Last Login</th><td>{{ jorge_lastlog_result.stdout_lines[-1] | default('N/A') }}</td></tr>
                </table>
                {% if jorge_home_result.stdout is defined %}
                <p style="margin: 1rem 0 .5rem; color: var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em;">Home Directory (/home/jorge)</p>
                <pre>{{ jorge_home_result.stdout }}</pre>
                {% endif %}
              </div>
            </section>

            <!-- Password Change -->
            <section>
              <header><h2>3 · Password Change</h2></header>
              <div class="section-body">
                <table>
                  <tr><th>Change Status</th><td>{{ password_change_status }}</td></tr>
                  <tr><th>Changed At</th><td>{{ password_changed_at }}</td></tr>
                  <tr><th>Hash Algorithm</th><td>SHA-512</td></tr>
                  <tr><th>Force Change on Next Login</th><td>No — password last changed set to today</td></tr>
                  <tr><th>Min Password Age</th><td>0 days</td></tr>
                  <tr><th>Max Password Age</th><td>99999 days (effectively never)</td></tr>
                </table>
              </div>
            </section>

            <!-- Password Aging — Before -->
            <section>
              <header><h2>4 · Password Aging — Before Change (chage -l)</h2></header>
              <div class="section-body">
                <pre>{{ jorge_chage_result.stdout | default('No data available') }}</pre>
              </div>
            </section>

            <!-- Password Aging — After -->
            <section>
              <header><h2>5 · Password Aging — After Change (chage -l)</h2></header>
              <div class="section-body">
                <pre>{{ jorge_chage_after.stdout | default('No data available') }}</pre>
              </div>
            </section>

            <!-- System Info -->
            <section>
              <header><h2>6 · System Information</h2></header>
              <div class="section-body">
                <table>
                  <tr><th>Hostname</th><td>{{ ansible_hostname }}</td></tr>
                  <tr><th>FQDN</th><td>{{ ansible_fqdn }}</td></tr>
                  <tr><th>OS</th><td>{{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_distribution_release }})</td></tr>
                  <tr><th>Kernel</th><td>{{ ansible_kernel }}</td></tr>
                  <tr><th>Architecture</th><td>{{ ansible_architecture }}</td></tr>
                  <tr><th>CPUs</th><td>{{ ansible_processor_vcpus }}</td></tr>
                  <tr><th>Memory</th><td>{{ (ansible_memtotal_mb / 1024) | round(1) }} GB total</td></tr>
                  <tr><th>IPv4 Address</th><td>{{ ansible_default_ipv4.address | default('N/A') }}</td></tr>
                  <tr><th>Uptime</th><td>{{ uptime_result.stdout }}</td></tr>
                  <tr><th>Ansible Version</th><td>{{ ansible_version.full }}</td></tr>
                </table>
              </div>
            </section>

            <footer>
              Generated by Ansible · {{ ansible_date_time.iso8601 }} · Host: {{ inventory_hostname }}
            </footer>

          </body>
          </html>
      delegate_to: localhost
      become: false

    # ----------------------------------------------------------
    # 6. CONFIRM REPORT STORED LOCALLY
    # ----------------------------------------------------------
    - name: Print report location
      ansible.builtin.debug:
        msg: "✅ Report saved locally to: {{ report_path }}"

    # ----------------------------------------------------------
    # 7. EMAIL REPORT
    # ----------------------------------------------------------
    - name: Email HTML report to recipient
      community.general.mail:
        host: "smtp.gmail.com"
        port: 587
        username: "{{ gmail_user }}"
        password: "{{ gmail_password }}"
        to: "{{ recipient }}"
        subject: "Jorge User Report - {{ inventory_hostname }} - {{ ansible_date_time.iso8601 }}"
        body: |
          Ansible user management completed for {{ inventory_hostname }}.

          ── Summary ──────────────────────────────────
          Host         : {{ inventory_hostname }}
          Connectivity : {{ connectivity_status }}
          User jorge   : {{ 'EXISTS' if jorge_getent.ansible_facts is defined else 'NOT FOUND' }}
          ID output    : {{ jorge_id_result.stdout | default('N/A') }}
          Pwd Change   : {{ password_change_status }}
          Changed At   : {{ password_changed_at }}
          Force Change : DISABLED (chage -d set to today)
          ─────────────────────────────────────────────

          Full details are in the attached HTML report.
        secure: starttls
        attach:
          - "{{ report_path }}"
      delegate_to: localhost
      become: false

    - name: Confirm email sent
      ansible.builtin.debug:
        msg: "📧 Report emailed to {{ recipient }} for host {{ inventory_hostname }}"
