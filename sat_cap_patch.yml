---
# =============================================================================
# Patch a RHEL Satellite and its Capsules, then email a report.
# Self-contained: no vars file, no templates directory.
#
#   Play 0  build the satellite / capsules groups from newline-delimited lists
#   Play 1  patch the Satellite   (serial: 1, stops the run on failure)
#   Play 2  patch the Capsules    (serial: 1, gated on a healthy Satellite)
#   Play 3  render + email the report, then fail the run if anything broke
#
# Run:  ansible-playbook -i localhost, satellite_patch.yml
#       ansible-playbook -i localhost, satellite_patch.yml -e satellite_take_backup=true
#
# The shared settings live in the &patch_vars anchor on Play 0 and are pulled
# into every later play with `<<: *patch_vars`. Play-level vars do NOT carry
# across plays on their own -- that was a real bug in the original, where the
# Capsule play referenced satellite_reboot_timeout and friends that only
# existed in the Satellite play's vars block.
# =============================================================================

- name: Build dynamic inventory from the server lists
  hosts: localhost
  connection: local
  gather_facts: false

  vars: &patch_vars

    # --- Target hosts --------------------------------------------------------
    # Newline-delimited. Blank lines and lines starting with # are ignored.
    satellite_list: |
      192.168.1.56

    capsule_list: |
      # capsule1.example.com
      # capsule2.example.com

    # --- Backup --------------------------------------------------------------
    satellite_backup_dir: "/var/opt/satellite/backups"
    satellite_take_backup: false

    # --- Update --------------------------------------------------------------
    satellite_maintain_update_extra_args: ""
    satellite_maintain_fail_on_unhealthy: true

    # --- Reboot --------------------------------------------------------------
    satellite_reboot_when_required: true
    satellite_reboot_timeout: 600
    satellite_reboot_connect_timeout: 5
    satellite_reboot_reconnect_delay: 30

    # --- Capsule guards ------------------------------------------------------
    # Refuse to patch Capsules unless the Satellite finished healthy this run.
    # Skipped automatically when the Satellite play never ran.
    capsule_require_healthy_satellite: true

    # Best-effort check for an in-flight content sync before patching a Capsule.
    # Needs hammer credentials against the Satellite; pass them with -e from a
    # vaulted file or an AAP credential, never in plaintext here.
    capsule_check_sync_status: false
    hammer_username: "aap"
    hammer_password: "Husker45#"

    # --- Report --------------------------------------------------------------
    report_local_dir: "/tmp/reports"
    recipient: "jorge.x.chavez@gmail.com"
    gmail_password: "nnmk dzsm ylgf tsur"
    gmail_user: "jorge.x.chavez@gmail.com"

    # Gmail app password. Deliberately NOT hardcoded -- this file will end up in
    # git and in AAP job output. Supply it one of these ways:
    #   export GMAIL_APP_PASSWORD='xxxx xxxx xxxx xxxx'   (picked up below)
    #   ansible-playbook ... -e @gmail_secret.yml --ask-vault-pass
    #   AAP: a custom credential type that injects GMAIL_APP_PASSWORD
   

    report_email_enabled: true
    report_email_smtp_host: "smtp.gmail.com"
    report_email_smtp_port: 587
    report_email_smtp_secure: "starttls"   # never | starttls | ssl | try
    report_email_smtp_username: "{{ gmail_user }}"
    report_email_smtp_password: "{{ gmail_password }}"
    report_email_from: "{{ gmail_user }}"
    report_email_to: "{{ recipient }}"
    report_email_attach_report: true

  tasks:
    - name: Normalise the raw lists into clean host lists
      ansible.builtin.set_fact:
        satellite_hosts: "{{ satellite_list | default('') | split('\n')
                             | map('trim')
                             | reject('match', '^#')
                             | select('ne', '')
                             | unique | list }}"
        capsule_hosts: "{{ capsule_list | default('') | split('\n')
                           | map('trim')
                           | reject('match', '^#')
                           | select('ne', '')
                           | unique | list }}"

    - name: Sanity-check the lists
      ansible.builtin.assert:
        that:
          - satellite_hosts | length + capsule_hosts | length > 0
          - satellite_hosts | length <= 1
          - satellite_hosts | intersect(capsule_hosts) | length == 0
        fail_msg: >-
          Bad target lists. Need at least one host, at most one Satellite,
          and no host in both lists.
          satellite={{ satellite_hosts }} capsules={{ capsule_hosts }}
        quiet: true

    - name: Add the Satellite to the satellite group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups:
          - satellite
          - linux_servers
      loop: "{{ satellite_hosts }}"
      changed_when: false

    - name: Add the Capsules to the capsules group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups:
          - capsules
          - linux_servers
      loop: "{{ capsule_hosts }}"
      changed_when: false

    - name: Show what will be patched
      ansible.builtin.debug:
        msg: >-
          Satellite: {{ satellite_hosts | join(', ') | default('none', true) }}
          | Capsules: {{ capsule_hosts | join(', ') | default('none', true) }}

    - name: Seed the run-level status flags
      ansible.builtin.set_fact:
        satellite_play_ran: false
        satellite_patch_ok: false
        patch_run_failed: false


# =============================================================================
- name: Patch the RHEL Satellite server
  hosts: satellite
  become: true
  serial: 1
  max_fail_percentage: 0
  vars:
    <<: *patch_vars

  tasks:
    - name: Patch the Satellite
      block:

        - name: Record that the Satellite play actually ran
          ansible.builtin.set_fact:
            satellite_play_ran: true
          delegate_to: localhost
          delegate_facts: true
          run_once: true
          become: false

        - name: Verify satellite-maintain is installed
          ansible.builtin.command: rpm -q satellite-maintain
          changed_when: false

        - name: Pre-update health check
          ansible.builtin.command: satellite-maintain health check --assumeyes
          register: sat_health_pre
          changed_when: false
          failed_when: satellite_maintain_fail_on_unhealthy | bool and sat_health_pre.rc != 0

        - name: Show pre-update health check output
          ansible.builtin.debug:
            var: sat_health_pre.stdout_lines

        # - name: Take an offline backup before patching (optional, off by default)
        #   ansible.builtin.command: >-
        #     satellite-maintain backup offline {{ satellite_backup_dir }}
        #     --assumeyes --skip-pulp-content
        #   when: satellite_take_backup | bool
        #   changed_when: true

        # Subcommands are start/stop/status/is-enabled -- NOT on/off.
        - name: Enable maintenance mode (serve 503 during the update)
          ansible.builtin.command: satellite-maintain maintenance-mode start
          changed_when: true

        - name: Update Satellite, always clearing maintenance mode afterwards
          block:
            - name: Run satellite-maintain update
              ansible.builtin.command: >-
                satellite-maintain update run --assumeyes
                {{ satellite_maintain_update_extra_args }}
              register: sat_update
              changed_when: true

            - name: Show update output
              ansible.builtin.debug:
                var: sat_update.stdout_lines
          always:
            - name: Disable maintenance mode
              ansible.builtin.command: satellite-maintain maintenance-mode stop
              changed_when: true

            - name: Confirm maintenance mode is actually off
              ansible.builtin.command: satellite-maintain maintenance-mode is-enabled
              register: sat_mm_state
              changed_when: false
              # is-enabled returns 0 when ON, 1 when OFF
              failed_when: sat_mm_state.rc == 0

        - name: Check whether a reboot is required
          ansible.builtin.command: needs-restarting -r
          register: sat_reboot_required
          changed_when: false
          # rc 1 legitimately means "reboot needed", not an error
          failed_when: false

        - name: Reboot Satellite if required
          ansible.builtin.reboot:
            reboot_timeout: "{{ satellite_reboot_timeout }}"
            connect_timeout: "{{ satellite_reboot_connect_timeout }}"
            pre_reboot_delay: 5
            post_reboot_delay: "{{ satellite_reboot_reconnect_delay }}"
            test_command: satellite-maintain service status --brief
          when:
            - satellite_reboot_when_required | bool
            - sat_reboot_required.rc == 1

        - name: Verify all Satellite services are running
          ansible.builtin.command: satellite-maintain service status
          register: sat_service_status
          changed_when: false

        - name: Post-update health check
          ansible.builtin.command: satellite-maintain health check --assumeyes
          register: sat_health_post
          changed_when: false

        - name: Show post-update health check output
          ansible.builtin.debug:
            var: sat_health_post.stdout_lines

        - name: Record per-host result for the emailed report
          ansible.builtin.set_fact:
            patch_report_role: satellite
            patch_report_status: >-
              {{ 'ok' if sat_service_status.rc == 0 and sat_health_post.rc == 0
                 else 'unhealthy' }}
            patch_report_pre_health_rc: "{{ sat_health_pre.rc }}"
            patch_report_update_rc: "{{ sat_update.rc }}"
            patch_report_reboot_performed: "{{ sat_reboot_required.rc == 1 }}"
            patch_report_post_health_rc: "{{ sat_health_post.rc }}"
            patch_report_service_status_rc: "{{ sat_service_status.rc }}"

        - name: Record whether the Satellite finished healthy, for the Capsule play
          ansible.builtin.set_fact:
            satellite_patch_ok: >-
              {{ hostvars['localhost'].satellite_patch_ok | default(true) | bool
                 and sat_service_status.rc == 0 and sat_health_post.rc == 0 }}
          delegate_to: localhost
          delegate_facts: true
          become: false

        - name: Fail the Satellite if it came back unhealthy
          ansible.builtin.fail:
            msg: >-
              Satellite finished the update but is unhealthy
              (service status rc={{ sat_service_status.rc }},
              health check rc={{ sat_health_post.rc }}).
          when: sat_service_status.rc != 0 or sat_health_post.rc != 0

      rescue:
        - name: Record the failure for the report
          ansible.builtin.set_fact:
            patch_report_role: satellite
            patch_report_status: failed
            patch_report_failed_task: "{{ ansible_failed_task.name | default('unknown') }}"
            patch_report_error: >-
              {{ ansible_failed_result.msg
                 | default(ansible_failed_result.stderr | default('see job output')) }}

        - name: Flag the run as failed and block the Capsule play
          ansible.builtin.set_fact:
            satellite_patch_ok: false
            patch_run_failed: true
          delegate_to: localhost
          delegate_facts: true
          become: false

        - name: Stop patching -- the report play still runs
          ansible.builtin.meta: end_play


# =============================================================================
- name: Patch RHEL Capsules one at a time
  hosts: capsules
  become: true
  serial: 1
  max_fail_percentage: 0
  vars:
    <<: *patch_vars

  tasks:
    # Skipped when the Satellite play never ran this time (e.g. the run was
    # limited to Capsules, or satellite_list is empty), since in that case
    # there is nothing to gate on. The original used `'satellite' in
    # ansible_limit`, which is undefined unless --limit was passed.
    - name: Refuse to patch Capsules if the Satellite did not finish healthy
      ansible.builtin.meta: end_play
      when:
        - capsule_require_healthy_satellite | bool
        - hostvars['localhost'].satellite_play_ran | default(false) | bool
        - not hostvars['localhost'].satellite_patch_ok | default(false) | bool

    - name: Patch the Capsule
      block:

        - name: Verify satellite-maintain is installed
          ansible.builtin.command: rpm -q satellite-maintain
          changed_when: false

        - name: Check for active content sync tasks on this Capsule (optional)
          ansible.builtin.command: >-
            hammer --username {{ hammer_username }} --password {{ hammer_password }}
            task list --search "state=running and
            (label=Actions::Katello::CapsuleContent::Sync or
            label=Actions::Katello::CapsuleContent::UpdateContentCounts)"
          register: capsule_sync_tasks
          changed_when: false
          no_log: true
          delegate_to: "{{ groups['satellite'] | first }}"
          when:
            - capsule_check_sync_status | bool
            - groups['satellite'] | default([]) | length > 0

        - name: Fail if this Capsule has an active sync task
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }} appears to have an active content sync task.
              Re-run once it completes, or investigate before patching.
          when:
            - capsule_check_sync_status | bool
            - capsule_sync_tasks.stdout is defined
            - inventory_hostname in capsule_sync_tasks.stdout

        - name: Pre-update health check
          ansible.builtin.command: satellite-maintain health check --assumeyes
          register: cap_health_pre
          changed_when: false
          failed_when: satellite_maintain_fail_on_unhealthy | bool and cap_health_pre.rc != 0

        - name: Show pre-update health check output
          ansible.builtin.debug:
            var: cap_health_pre.stdout_lines

        - name: Run satellite-maintain update
          ansible.builtin.command: >-
            satellite-maintain update run --assumeyes
            {{ satellite_maintain_update_extra_args }}
          register: cap_update
          changed_when: true

        - name: Show update output
          ansible.builtin.debug:
            var: cap_update.stdout_lines

        - name: Check whether a reboot is required
          ansible.builtin.command: needs-restarting -r
          register: cap_reboot_required
          changed_when: false
          failed_when: false

        - name: Reboot Capsule if required
          ansible.builtin.reboot:
            reboot_timeout: "{{ satellite_reboot_timeout }}"
            connect_timeout: "{{ satellite_reboot_connect_timeout }}"
            pre_reboot_delay: 5
            post_reboot_delay: "{{ satellite_reboot_reconnect_delay }}"
            test_command: satellite-maintain service status --brief
          when:
            - satellite_reboot_when_required | bool
            - cap_reboot_required.rc == 1

        - name: Verify all Capsule services are running
          ansible.builtin.command: satellite-maintain service status
          register: cap_service_status
          changed_when: false

        - name: Post-update health check
          ansible.builtin.command: satellite-maintain health check --assumeyes
          register: cap_health_post
          changed_when: false

        - name: Show post-update health check output
          ansible.builtin.debug:
            var: cap_health_post.stdout_lines

        - name: Record per-host result for the emailed report
          ansible.builtin.set_fact:
            patch_report_role: capsule
            patch_report_status: >-
              {{ 'ok' if cap_service_status.rc == 0 and cap_health_post.rc == 0
                 else 'unhealthy' }}
            patch_report_pre_health_rc: "{{ cap_health_pre.rc }}"
            patch_report_update_rc: "{{ cap_update.rc }}"
            patch_report_reboot_performed: "{{ cap_reboot_required.rc == 1 }}"
            patch_report_post_health_rc: "{{ cap_health_post.rc }}"
            patch_report_service_status_rc: "{{ cap_service_status.rc }}"

        - name: Fail this Capsule if it came back unhealthy
          ansible.builtin.fail:
            msg: >-
              Capsule finished the update but is unhealthy
              (service status rc={{ cap_service_status.rc }},
              health check rc={{ cap_health_post.rc }}).
          when: cap_service_status.rc != 0 or cap_health_post.rc != 0

      rescue:
        - name: Record the failure for the report
          ansible.builtin.set_fact:
            patch_report_role: capsule
            patch_report_status: failed
            patch_report_failed_task: "{{ ansible_failed_task.name | default('unknown') }}"
            patch_report_error: >-
              {{ ansible_failed_result.msg
                 | default(ansible_failed_result.stderr | default('see job output')) }}

        - name: Flag the run as failed
          ansible.builtin.set_fact:
            patch_run_failed: true
          delegate_to: localhost
          delegate_facts: true
          become: false

        - name: Stop patching further Capsules -- the report play still runs
          ansible.builtin.meta: end_play


# =============================================================================
- name: Render and email the patch run report
  hosts: localhost
  connection: local
  become: false
  gather_facts: true
  vars:
    <<: *patch_vars
    report_path: "{{ report_local_dir }}/satellite_patch_report_{{ ansible_date_time.iso8601_basic_short }}.txt"
    report_targets: "{{ (groups['satellite'] | default([])) + (groups['capsules'] | default([])) }}"

  tasks:
    - name: Ensure the local report directory exists
      ansible.builtin.file:
        path: "{{ report_local_dir }}"
        state: directory
        mode: "0755"

    # copy's `content` is templated, so the report body lives inline here
    # instead of in templates/patch_report.j2.
    - name: Render patch report
      ansible.builtin.copy:
        dest: "{{ report_path }}"
        mode: "0644"
        content: |
          ===============================================================================
           RHEL Satellite / Capsule patch report
          ===============================================================================
           Generated : {{ ansible_date_time.iso8601 }}
           Control   : {{ ansible_fqdn | default('localhost') }}
           Result    : {{ 'FAILED' if patch_run_failed | default(false) | bool else 'SUCCESS' }}
           Hosts     : {{ report_targets | length }} targeted
          ===============================================================================

          {{ 'HOST'.ljust(34) }}{{ 'ROLE'.ljust(11) }}{{ 'RESULT'.ljust(14) }}{{ 'REBOOTED'.ljust(10) }}
          {{ '-' * 79 }}
          {% for h in report_targets %}
          {% set hv = hostvars[h] | default({}) %}
          {{ h[:33].ljust(34) }}{{ (hv.patch_report_role | default('-'))[:10].ljust(11) }}{{ (hv.patch_report_status | default('not attempted') | trim)[:13].ljust(14) }}{{ ('yes' if hv.patch_report_reboot_performed | default(false) | bool else 'no').ljust(10) }}
          {% endfor %}

          -------------------------------------------------------------------------------
           Detail
          -------------------------------------------------------------------------------
          {% for h in report_targets %}
          {% set hv = hostvars[h] | default({}) %}

           {{ h }} ({{ hv.patch_report_role | default('unknown role') }})
             status              : {{ hv.patch_report_status | default('not attempted') | trim }}
          {% if hv.patch_report_status is not defined %}
             (never reached -- the run stopped before it, or it was skipped
              because the Satellite did not finish healthy)
          {% elif hv.patch_report_status | trim == 'failed' %}
             failed task         : {{ hv.patch_report_failed_task | default('unknown') }}
             error               : {{ hv.patch_report_error | default('see job output') | trim }}
          {% else %}
             pre-update health   : rc={{ hv.patch_report_pre_health_rc | default('-') }}
             update              : rc={{ hv.patch_report_update_rc | default('-') }}
             reboot performed    : {{ 'yes' if hv.patch_report_reboot_performed | default(false) | bool else 'no' }}
             service status      : rc={{ hv.patch_report_service_status_rc | default('-') }}
             post-update health  : rc={{ hv.patch_report_post_health_rc | default('-') }}
          {% endif %}
          {% endfor %}

          -------------------------------------------------------------------------------
           rc=0 means the command succeeded. A non-zero rc on a health check or service
           status line is worth a look even where the overall result is SUCCESS.
          -------------------------------------------------------------------------------

    - name: Show patch report
      ansible.builtin.debug:
        msg: "{{ lookup('file', report_path).split('\n') }}"

    - name: Fail early if email is on but no app password was supplied
      ansible.builtin.assert:
        that:
          - report_email_smtp_password | default('', true) | length > 0
