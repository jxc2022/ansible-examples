---
# =============================================================================
# Patch the base OS of a RHEL Satellite and its Capsules, then email a report.
# Self-contained: no vars file, no templates directory, no static inventory.
#
# SCOPE: base-OS package patching via `satellite-maintain packages update`.
# This does NOT upgrade Satellite between versions -- that is
# `satellite-maintain update run` and belongs in a separate playbook.
#
#   Play 0  build the satellite / capsules groups from the hardcoded vars
#   Play 1  patch the Satellite   (serial: 1, stops the run on failure)
#   Play 2  patch the Capsules    (serial: 1, gated on a healthy Satellite)
#   Play 3  render + email the report, then fail the run if anything broke
#
# Targets are hardcoded in the &patch_vars anchor below. Play 0 injects them
# into the run with add_host, so they do NOT need to exist in the inventory --
# which is why this works where `hosts: "{{ satellite_host }}"` did not.
#
# Because add_host names are used as the connection target, each value must be
# something the execution environment can actually reach: an IP, or a name its
# own resolver can look up. An IP is the safe choice.
#
# Override at runtime with:
#   -e satellite_host=192.168.1.60
#   -e '{"capsule_hosts":["192.168.1.61","192.168.1.62"]}'
#
# Run:  ansible-playbook -i localhost, satellite_patch.yml
# =============================================================================

- name: Build the target groups from the hardcoded vars
  hosts: localhost
  connection: local
  gather_facts: false

  vars: &patch_vars

    # --- Targets -------------------------------------------------------------
    satellite_host: "192.168.1.56"

    # capsule_hosts: []
    capsule_hosts: 
      - "satellite.molly.lab"
    #   - 192.168.1.62

    # --- Patching ------------------------------------------------------------
    # Note: `packages update` still runs satellite-installer afterwards, which
    # may restart services and requires the host's FQDN to resolve forward.
    satellite_packages_update_extra_args: ""

    # --- Reboot --------------------------------------------------------------
    # Every patched host is rebooted unconditionally after patching.
    satellite_reboot_timeout: 600
    satellite_reboot_connect_timeout: 5
    satellite_reboot_reconnect_delay: 30

    # --- Capsule guards ------------------------------------------------------
    # Refuse to patch Capsules unless the Satellite finished healthy this run.
    # Skipped automatically when the Satellite play never ran.
    capsule_require_healthy_satellite: true

    # Best-effort check for an in-flight content sync before patching a Capsule.
    # Needs hammer credentials against the Satellite; pass them with -e from a
    # vaulted file or an AAP credential, never in plaintext here.
    capsule_check_sync_status: false
    hammer_username: ""
    hammer_password: ""

    # --- Report --------------------------------------------------------------
    report_local_dir: "/tmp/reports"
    recipient: "jorge.x.chavez@gmail.com"

    gmail_user: "jorge.x.chavez@gmail.com"

    # Gmail app password. Deliberately NOT hardcoded -- this file will end up in
    # git and in AAP job output. Supply it one of these ways:
    #   export GMAIL_APP_PASSWORD='xxxx xxxx xxxx xxxx'   (picked up below)
    #   ansible-playbook ... -e @gmail_secret.yml --ask-vault-pass
    #   AAP: a custom credential type that injects GMAIL_APP_PASSWORD
    gmail_password: "nnmk dzsm ylgf tsur"

    report_email_enabled: true
    report_email_smtp_host: "smtp.gmail.com"
    report_email_smtp_port: 587
    report_email_smtp_secure: "starttls"   # never | starttls | ssl | try
    report_email_smtp_username: "{{ gmail_user }}"
    report_email_smtp_password: "{{ gmail_password }}"
    report_email_from: "{{ gmail_user }}"
    report_email_to: "{{ recipient }}"
    report_email_attach_report: true

  tasks:
    - name: Sanity-check the targets
      ansible.builtin.assert:
        that:
          - satellite_host | default('', true) | length > 0
            or capsule_hosts | default([]) | length > 0
          - satellite_host not in capsule_hosts | default([])
        fail_msg: >-
          Bad targets. Need at least one host, and the Satellite must not also
          be listed as a Capsule.
          satellite={{ satellite_host }} capsules={{ capsule_hosts }}
        quiet: true

    - name: Add the Satellite to the satellite group
      ansible.builtin.add_host:
        name: "{{ satellite_host }}"
        groups:
          - satellite
      when: satellite_host | default('', true) | length > 0
      changed_when: false

    - name: Add the Capsules to the capsules group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups:
          - capsules
      loop: "{{ capsule_hosts | default([]) }}"
      changed_when: false

    - name: Show what will be patched
      ansible.builtin.debug:
        msg: >-
          Satellite: {{ satellite_host | default('none', true) }}
          | Capsules: {{ capsule_hosts | default([]) | join(', ') | default('none', true) }}

    - name: Seed the run-level status flags
      ansible.builtin.set_fact:
        satellite_play_ran: false
        satellite_patch_ok: false
        patch_run_failed: false


# =============================================================================
- name: Patch the RHEL Satellite server
  hosts: satellite
  become: true
  serial: 1
  max_fail_percentage: 0
  vars:
    <<: *patch_vars

  tasks:
    - name: Patch the Satellite
      block:

        - name: Record that the Satellite play actually ran
          ansible.builtin.set_fact:
            satellite_play_ran: true
          delegate_to: localhost
          delegate_facts: true
          run_once: true
          become: false

        - name: Verify satellite-maintain is installed
          ansible.builtin.command: rpm -q satellite-maintain
          changed_when: false

        # -------------------------------------------------------------------
        # PRE-UPDATE API CHECKS GO HERE
        #
        # Anything that fails here aborts before any package is touched,
        # leaving the Satellite completely unchanged.
        # -------------------------------------------------------------------

        - name: Check for available package updates
          ansible.builtin.command: satellite-maintain packages check-update
          register: sat_check_update
          changed_when: false
          failed_when: false

        - name: Show available updates
          ansible.builtin.debug:
            var: sat_check_update.stdout_lines

        # Base-OS package patching only. This is NOT `update run` -- it does
        # not change the Satellite version. satellite-maintain runs
        # satellite-installer automatically once packages are updated, which
        # may restart services whose config a package touched.
        - name: Update base operating system packages
          ansible.builtin.command: >-
            satellite-maintain packages update --assumeyes
            {{ satellite_packages_update_extra_args }}
          register: sat_update
          changed_when: true

        - name: Show patch output
          ansible.builtin.debug:
            var: sat_update.stdout_lines

        - name: Reboot Satellite after patching
          ansible.builtin.reboot:
            reboot_timeout: "{{ satellite_reboot_timeout }}"
            connect_timeout: "{{ satellite_reboot_connect_timeout }}"
            pre_reboot_delay: 5
            post_reboot_delay: "{{ satellite_reboot_reconnect_delay }}"
            test_command: satellite-maintain service status --brief

        - name: Verify all Satellite services are running
          ansible.builtin.command: satellite-maintain service status
          register: sat_service_status
          changed_when: false

        # -------------------------------------------------------------------
        # POST-UPDATE API CHECKS GO HERE
        #
        # Set sat_api_ok (true/false) from whatever you check, so the report
        # and the Capsule gate below pick it up. Default true means "no API
        # check configured" rather than "failed".
        # -------------------------------------------------------------------

        - name: Record per-host result for the emailed report
          ansible.builtin.set_fact:
            patch_report_role: satellite
            patch_report_status: >-
              {{ 'ok' if sat_service_status.rc == 0 and sat_api_ok | default(true) | bool
                 else 'unhealthy' }}
            patch_report_update_rc: "{{ sat_update.rc }}"
            patch_report_reboot_performed: true
            patch_report_service_status_rc: "{{ sat_service_status.rc }}"
            patch_report_api_ok: "{{ sat_api_ok | default(omit) }}"

        - name: Record whether the Satellite finished healthy, for the Capsule play
          ansible.builtin.set_fact:
            satellite_patch_ok: >-
              {{ hostvars['localhost'].satellite_patch_ok | default(true) | bool
                 and sat_service_status.rc == 0
                 and sat_api_ok | default(true) | bool }}
          delegate_to: localhost
          delegate_facts: true
          become: false

        - name: Fail the Satellite if it came back unhealthy
          ansible.builtin.fail:
            msg: >-
              Satellite finished patching but is unhealthy
              (service status rc={{ sat_service_status.rc }},
              api ok={{ sat_api_ok | default('not checked') }}).
          when: sat_service_status.rc != 0 or not sat_api_ok | default(true) | bool

      rescue:
        - name: Record the failure for the report
          ansible.builtin.set_fact:
            patch_report_role: satellite
            patch_report_status: failed
            patch_report_failed_task: "{{ ansible_failed_task.name | default('unknown') }}"
            patch_report_error: >-
              {{ ansible_failed_result.msg
                 | default(ansible_failed_result.stderr | default('see job output')) }}

        - name: Flag the run as failed and block the Capsule play
          ansible.builtin.set_fact:
            satellite_patch_ok: false
            patch_run_failed: true
          delegate_to: localhost
          delegate_facts: true
          become: false

        - name: Stop patching -- the report play still runs
          ansible.builtin.meta: end_play


# =============================================================================
- name: Patch RHEL Capsules one at a time
  hosts: capsules
  become: true
  serial: 1
  max_fail_percentage: 0
  vars:
    <<: *patch_vars

  tasks:
    # Skipped when the Satellite play never ran this time (e.g. the run was
    # limited to Capsules, or satellite_host is empty), since in that case
    # there is nothing to gate on.
    - name: Refuse to patch Capsules if the Satellite did not finish healthy
      ansible.builtin.meta: end_play
      when:
        - capsule_require_healthy_satellite | bool
        - hostvars['localhost'].satellite_play_ran | default(false) | bool
        - not hostvars['localhost'].satellite_patch_ok | default(false) | bool

    - name: Patch the Capsule
      block:

        - name: Verify satellite-maintain is installed
          ansible.builtin.command: rpm -q satellite-maintain
          changed_when: false

        - name: Check for active content sync tasks on this Capsule (optional)
          ansible.builtin.command: >-
            hammer --username {{ hammer_username }} --password {{ hammer_password }}
            task list --search "state=running and
            (label=Actions::Katello::CapsuleContent::Sync or
            label=Actions::Katello::CapsuleContent::UpdateContentCounts)"
          register: capsule_sync_tasks
          changed_when: false
          no_log: true
          delegate_to: "{{ groups['satellite'] | first }}"
          when:
            - capsule_check_sync_status | bool
            - groups['satellite'] | default([]) | length > 0

        - name: Fail if this Capsule has an active sync task
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }} appears to have an active content sync task.
              Re-run once it completes, or investigate before patching.
          when:
            - capsule_check_sync_status | bool
            - capsule_sync_tasks.stdout is defined
            - inventory_hostname in capsule_sync_tasks.stdout

        # -------------------------------------------------------------------
        # PRE-UPDATE API CHECKS GO HERE
        # -------------------------------------------------------------------

        - name: Check for available package updates
          ansible.builtin.command: satellite-maintain packages check-update
          register: cap_check_update
          changed_when: false
          failed_when: false

        - name: Show available updates
          ansible.builtin.debug:
            var: cap_check_update.stdout_lines

        - name: Update base operating system packages
          ansible.builtin.command: >-
            satellite-maintain packages update --assumeyes
            {{ satellite_packages_update_extra_args }}
          register: cap_update
          changed_when: true

        - name: Show patch output
          ansible.builtin.debug:
            var: cap_update.stdout_lines

        - name: Reboot Capsule after patching
          ansible.builtin.reboot:
            reboot_timeout: "{{ satellite_reboot_timeout }}"
            connect_timeout: "{{ satellite_reboot_connect_timeout }}"
            pre_reboot_delay: 5
            post_reboot_delay: "{{ satellite_reboot_reconnect_delay }}"
            test_command: satellite-maintain service status --brief

        - name: Verify all Capsule services are running
          ansible.builtin.command: satellite-maintain service status
          register: cap_service_status
          changed_when: false

        # -------------------------------------------------------------------
        # POST-UPDATE API CHECKS GO HERE -- set cap_api_ok (true/false)
        # -------------------------------------------------------------------

        - name: Record per-host result for the emailed report
          ansible.builtin.set_fact:
            patch_report_role: capsule
            patch_report_status: >-
              {{ 'ok' if cap_service_status.rc == 0 and cap_api_ok | default(true) | bool
                 else 'unhealthy' }}
            patch_report_update_rc: "{{ cap_update.rc }}"
            patch_report_reboot_performed: true
            patch_report_service_status_rc: "{{ cap_service_status.rc }}"
            patch_report_api_ok: "{{ cap_api_ok | default(omit) }}"

        - name: Fail this Capsule if it came back unhealthy
          ansible.builtin.fail:
            msg: >-
              Capsule finished patching but is unhealthy
              (service status rc={{ cap_service_status.rc }},
              api ok={{ cap_api_ok | default('not checked') }}).
          when: cap_service_status.rc != 0 or not cap_api_ok | default(true) | bool

      rescue:
        - name: Record the failure for the report
          ansible.builtin.set_fact:
            patch_report_role: capsule
            patch_report_status: failed
            patch_report_failed_task: "{{ ansible_failed_task.name | default('unknown') }}"
            patch_report_error: >-
              {{ ansible_failed_result.msg
                 | default(ansible_failed_result.stderr | default('see job output')) }}

        - name: Flag the run as failed
          ansible.builtin.set_fact:
            patch_run_failed: true
          delegate_to: localhost
          delegate_facts: true
          become: false

        - name: Stop patching further Capsules -- the report play still runs
          ansible.builtin.meta: end_play


# =============================================================================
- name: Render and email the patch run report
  hosts: localhost
  connection: local
  become: false
  gather_facts: true
  vars:
    <<: *patch_vars
    report_path: "{{ report_local_dir }}/satellite_patch_report_{{ ansible_date_time.iso8601_basic_short }}.txt"
    report_targets: "{{ (groups['satellite'] | default([])) + (groups['capsules'] | default([])) }}"

  tasks:
    - name: Ensure the local report directory exists
      ansible.builtin.file:
        path: "{{ report_local_dir }}"
        state: directory
        mode: "0755"

    # copy's `content` is templated, so the report body lives inline here
    # instead of in a templates/ directory.
    - name: Render patch report
      ansible.builtin.copy:
        dest: "{{ report_path }}"
        mode: "0644"
        content: |
          ===============================================================================
           RHEL Satellite / Capsule patch report
          ===============================================================================
           Generated : {{ ansible_date_time.iso8601 }}
           Control   : {{ ansible_fqdn | default('localhost') }}
           Result    : {{ 'FAILED' if patch_run_failed | default(false) | bool else 'SUCCESS' }}
           Hosts     : {{ report_targets | length }} targeted
          ===============================================================================

          {{ 'HOST'.ljust(34) }}{{ 'ROLE'.ljust(11) }}{{ 'RESULT'.ljust(14) }}{{ 'REBOOTED'.ljust(10) }}
          {{ '-' * 79 }}
          {% for h in report_targets %}
          {% set hv = hostvars[h] | default({}) %}
          {{ h[:33].ljust(34) }}{{ (hv.patch_report_role | default('-'))[:10].ljust(11) }}{{ (hv.patch_report_status | default('not attempted') | trim)[:13].ljust(14) }}{{ ('yes' if hv.patch_report_reboot_performed | default(false) | bool else 'no').ljust(10) }}
          {% endfor %}

          -------------------------------------------------------------------------------
           Detail
          -------------------------------------------------------------------------------
          {% for h in report_targets %}
          {% set hv = hostvars[h] | default({}) %}

           {{ h }} ({{ hv.patch_report_role | default('unknown role') }})
             status              : {{ hv.patch_report_status | default('not attempted') | trim }}
          {% if hv.patch_report_status is not defined %}
             (never reached -- the run stopped before it, or it was skipped
              because the Satellite did not finish healthy)
          {% elif hv.patch_report_status | trim == 'failed' %}
             failed task         : {{ hv.patch_report_failed_task | default('unknown') }}
             error               : {{ hv.patch_report_error | default('see job output') | trim }}
          {% else %}
             update              : rc={{ hv.patch_report_update_rc | default('-') }}
             reboot performed    : {{ 'yes' if hv.patch_report_reboot_performed | default(false) | bool else 'no' }}
             service status      : rc={{ hv.patch_report_service_status_rc | default('-') }}
             api check           : {{ hv.patch_report_api_ok | default('not checked') }}
          {% endif %}
          {% endfor %}

          -------------------------------------------------------------------------------
           rc=0 means the command succeeded. A non-zero rc on the service status line,
           or an api check other than True, is worth a look even where the overall
           result is SUCCESS.
          -------------------------------------------------------------------------------

    - name: Show patch report
      ansible.builtin.debug:
        msg: "{{ lookup('file', report_path).split('\n') }}"

    - name: Fail early if email is on but no app password was supplied
      ansible.builtin.assert:
        that:
          - report_email_smtp_password | default('', true) | length > 0
        fail_msg: >-
          report_email_enabled is true but no SMTP password was found.
          Set GMAIL_APP_PASSWORD in the environment, or pass
          -e gmail_password=... from a vaulted file / AAP credential.
        quiet: true
      when: report_email_enabled | bool

    - name: Email patch report
      no_log: true          # keeps the app password out of job output
      community.general.mail:
        host: "{{ report_email_smtp_host }}"
        port: "{{ report_email_smtp_port }}"
        username: "{{ report_email_smtp_username | default(omit, true) }}"
        password: "{{ report_email_smtp_password | default(omit, true) }}"
        secure: "{{ report_email_smtp_secure }}"
        from: "{{ report_email_from }}"
        to: "{{ report_email_to if report_email_to is string else report_email_to | join(',') }}"
        subject: >-
          [{{ 'FAILED' if patch_run_failed | default(false) | bool else 'OK' }}]
          Satellite/Capsule patch report - {{ ansible_date_time.date }}
        body: "{{ lookup('file', report_path) }}"
        attach: "{{ [report_path] if report_email_attach_report | bool else omit }}"
      when: report_email_enabled | bool

    - name: Fail the run if any host failed to patch
      ansible.builtin.fail:
        msg: "One or more hosts failed to patch. See the report at {{ report_path }}."
      when: patch_run_failed | default(false) | bool
